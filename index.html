<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rancang Berita</title>
<style>
:root{--bg:#eaf4ff;--card:#fff;--ink:#12305e;--mut:#5a6f91;--pri:#1d4ed8;--pri2:#dbeafe;--yel:#facc15;--ok:#16a34a;--bad:#dc2626;--bd:#c7dcf7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b33;--card:#15284a;--ink:#e6efff;--mut:#9fb3d6;--pri:#60a5fa;--pri2:#1e3a6e;--bd:#2b4780}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,Candara,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:980px;margin:auto;padding:14px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--card);border-radius:18px;padding:10px 14px;box-shadow:0 3px 12px #1d4ed822;margin-bottom:14px}
.logo{font-weight:800;font-size:1.25rem;color:var(--pri)}.logo b{display:inline-block;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-8deg)}}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 4px 14px #1d4ed81c;border:2px solid var(--bd)}
h1,h2,h3{margin:.2em 0 .4em;color:var(--ink)}h1{font-size:2rem}
.btn{border:0;border-radius:14px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--pri);color:#fff;margin:3px;transition:transform .15s}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn.s{background:var(--pri2);color:var(--ink)}.btn.y{background:var(--yel);color:#422}.btn.r{background:var(--bad)}.btn:disabled{opacity:.5;cursor:not-allowed}
input,textarea,select{width:100%;font:inherit;padding:10px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--ink);margin:3px 0 8px}
textarea{min-height:110px}label{font-weight:700;font-size:.95rem}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.hero{text-align:center}.hero .big{font-size:4rem;animation:bob 2.2s infinite}
.map{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.node{border-radius:20px;padding:14px;text-align:center;background:var(--pri2);border:3px dashed var(--bd)}
.node.ok{border:3px solid var(--ok)}.node.lock{opacity:.6;filter:grayscale(.6)}.node .ic{font-size:2.4rem}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--yel);color:#422}
.bar{height:16px;border-radius:99px;background:var(--pri2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yel),#f59e0b);transition:width .6s}
.err{background:#fee2e2;color:#7f1d1d;border-radius:12px;padding:10px;margin:8px 0}.okb{background:#dcfce7;color:#14532d;border-radius:12px;padding:10px;margin:8px 0}
.info{background:var(--pri2);border-left:6px solid var(--yel);border-radius:12px;padding:10px;margin:10px 0}
.tabs button{margin:2px}.av{font-size:3rem}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
.art{font-family:Calibri,sans-serif}.art.tnr{font-family:"Times New Roman",serif}.art h2{font-size:1.7rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:14px;z-index:9;font-weight:700}.toast.bad{background:var(--bad)}
.cf{position:fixed;top:-30px;font-size:1.8rem;animation:fall 2s linear forwards;z-index:8;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.sug{border:2px solid var(--bd);border-radius:12px;padding:8px;margin:6px 0}.sub{font-size:.85rem;color:var(--mut)}
</style></head><body><div class="wrap" id="app">Memuat…</div>
<script>
const app=document.getElementById("app");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let db=null,me=null,acc=null,W=null,role=null,view="gate",ctx={};
const S={
 async get(c,id){if(db){const s=await db.collection(c).doc(id).get();return s.exists?s.data():null}return ls.get(c+"/"+id)},
 async set(c,id,d){if(db){await db.collection(c).doc(id).set(d)}else{ls.set(c+"/"+id,d);const ix=ls.get("ix/"+c)||[];if(!ix.includes(id)){ix.push(id);ls.set("ix/"+c,ix)}}},
 async list(c){if(db){const s=await db.collection(c).get();return s.docs.map(x=>Object.assign({id:x.id},x.data()))}return(ls.get("ix/"+c)||[]).map(id=>Object.assign({id},ls.get(c+"/"+id)))}
};
const SERVER_PW="12345678",TEACHER="Shabrina Luh Nayank Sakti, S.S.",TEACHER_PW="1234";
const emptyW=()=>({bahan:{},bahanOk:false,m1:{facts:[{j:"Fakta"},{j:"Fakta"},{j:"Fakta"},{j:"Fakta"},{j:"Fakta"}],done:false},
 m2:{what:{},who:{},where:{},when:{},why:{},how:{},done:false},m3:{k:"",t:"",e:"",done:false},m4:{k:"",t:"",e:"",done:false}});
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("rb|"+s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const mkId=(n,a,k)=>(n+"_"+a+"_"+k).toLowerCase().replace(/[^a-z0-9_]+/g,"-");
const getP=p=>p.split(".").reduce((o,k)=>o==null?o:o[k],W);
function setP(p,v){const ks=p.split(".");let o=W;ks.slice(0,-1).forEach(k=>o=o[k]);o[ks[ks.length-1]]=v;sv()}
let tm;function sv(){clearTimeout(tm);tm=setTimeout(()=>S.set("work",me,W).catch(()=>toast("Gagal menyimpan draf",1)),500)}
async function svNow(){clearTimeout(tm);try{await S.set("work",me,W);return true}catch(e){toast("Gagal menyimpan. Draf tetap ada di layar.",1);return false}}
function toast(m,bad){const t=document.createElement("div");t.className="toast"+(bad?" bad":"");t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2800)}
function confetti(){for(let i=0;i<22;i++){const e=document.createElement("span");e.className="cf";e.textContent=["⭐","🎉","✨","📰"][i%4];e.style.left=Math.random()*100+"vw";e.style.animationDelay=Math.random()*.5+"s";document.body.append(e);setTimeout(()=>e.remove(),2600)}}
function go(v,c){view=v;ctx=c||{};render();scrollTo(0,0)}
const inp=(p,ph,t)=>`<input data-p="${p}" type="${t||"text"}" placeholder="${esc(ph||"")}" value="${esc(getP(p))}">`;
const ta=(p,ph,c)=>`<textarea data-p="${p}"${c?" data-c=1":""} placeholder="${esc(ph||"")}">${esc(getP(p))}</textarea>`;
const sents=t=>(t||"").split(/[.!?]+(?:\s+|$)/).filter(s=>s.trim().length>2).length;
function bind(){app.querySelectorAll("[data-p]").forEach(e=>{const f=()=>{setP(e.dataset.p,e.type==="checkbox"?e.checked:e.value);cnt()};e.addEventListener("input",f);e.addEventListener("change",f)});cnt()}
function cnt(){app.querySelectorAll("textarea[data-c]").forEach(e=>{const n=sents(e.value),s=e.nextElementSibling;if(s&&s.classList.contains("cn"))s.textContent=`Jumlah kalimat: ${n} / minimal 3 ${n>=3?"✅":""}`})}
const AV={L:"👦",P:"👧"};
const MS=[
{ic:"🔍",t:"Identifikasi Fakta",d:"Temukan fakta dan bedakan fakta dari opini.",mat:`<h3>Ciri-Ciri Fakta dalam Berita</h3><p><b>1. Dapat dibuktikan kebenarannya.</b> Didukung bukti yang dapat diperiksa: dokumen, pengamatan, data, atau keterangan sumber yang jelas.</p><p><b>2. Memiliki data yang akurat.</b> Angka, tanggal, waktu, tempat, dan nama sesuai sumber.</p><p><b>3. Objektif.</b> Berdasarkan kenyataan dan sumber yang dapat dipertanggungjawabkan, bukan perasaan atau penilaian pribadi penulis.</p><div class="info">Fakta adalah informasi yang dapat diverifikasi. Opini adalah pendapat, penilaian, atau interpretasi seseorang. Opini narasumber boleh diberitakan sebagai pendapat yang diatribusikan jelas, tetapi tidak otomatis menjadi fakta objektif.</div>`},
{ic:"📋",t:"Deteksi 5W+1H",d:"Lengkapi enam unsur penting berita.",mat:`<h3>Unsur-Unsur Berita (5W+1H)</h3><p><b>Apa (What)</b>: peristiwa apa yang terjadi?<br><b>Di mana (Where)</b>: lokasi peristiwa.<br><b>Kapan (When)</b>: waktu berlangsungnya peristiwa.<br><b>Siapa (Who)</b>: pihak yang terlibat.<br><b>Mengapa (Why)</b>: latar belakang atau alasan.<br><b>Bagaimana (How)</b>: proses, keadaan, atau kronologi.</p><div class="info">Keenam unsur membantu pembaca memahami peristiwa secara lengkap. Tidak semua unsur harus sama panjang, tetapi informasinya harus akurat dan tidak boleh dibuat-buat.</div>`},
{ic:"🧩",t:"Struktur Berita",d:"Susun kepala, tubuh, dan ekor berita.",mat:`<h3>Struktur Berita</h3><p><b>1. Kepala berita (lead)</b>: inti peristiwa, biasanya memuat apa, siapa, di mana, dan kapan.</p><p><b>2. Tubuh berita (body)</b>: rincian kronologi, latar belakang, alasan, proses, dan informasi pendukung.</p><p><b>3. Ekor berita (ending)</b>: informasi tambahan yang tingkat kepentingannya relatif lebih rendah.</p><div class="info">🔺 Kepala = paling penting → Tubuh = rincian → Ekor = tambahan. Dalam praktik jurnalistik, struktur dapat bervariasi menurut jenis berita dan gaya media.</div>`},
{ic:"✏️",t:"Penyuntingan Berita",d:"Perbaiki ejaan, pilihan kata, dan kaidah kebahasaan.",mat:`<h3>Kaidah Kebahasaan Berita</h3><p><b>Bahasa baku</b> sesuai ejaan (EYD/PUEBI) dan kalimat efektif.<br><b>Kalimat langsung</b> mengutip persis ucapan narasumber dengan tanda petik. Contoh: Kepala sekolah mengatakan, “Kegiatan ini diharapkan meningkatkan kepedulian siswa.” Jangan membuat kutipan palsu.<br><b>Konjungsi temporal/kronologis</b>: kemudian, lalu, setelah itu, sebelumnya, sejak.<br><b>Verba mental</b>: menilai, memperkirakan, menyadari, menyimpulkan; jangan menggantikan fakta.<br><b>Keterangan waktu dan tempat</b> harus jelas dan sesuai sumber.</p><div class="info">Periksa juga: huruf kapital, tanda baca, penulisan nama dan angka, konsistensi informasi, ketepatan atribusi, dan beda fakta–opini–kutipan.</div>`}];
const started=n=>{const m=W["m"+n],e=emptyW()["m"+n];return m.done||JSON.stringify(Object.assign({},m,{done:0}))!==JSON.stringify(Object.assign({},e,{done:0}))};
const st=n=>W["m"+n].done?"Selesai":started(n)?"Sedang Dikerjakan":"Belum Dimulai";
const lock=n=>n===1?(W.bahanOk?"":"Isi dan simpan Bahan Berita dulu."):(W["m"+(n-1)].done?"":"Selesaikan Misi "+(n-1)+" dulu.");
function head(){const t=role==="guru"?"🧑‍🏫 "+TEACHER:acc?(AV[acc.avatar]||"🙂")+" "+esc(acc.nama):"";
 return `<div class="top"><span class="logo"><b>📰</b> Rancang Berita</span><span class="sub">${db?"🌐 Server aktif (data dibagikan ke semua perangkat)":"⚠️ Mode lokal: data hanya di perangkat ini. Buka lewat tautan artifact Claude agar terhubung ke server."}</span><span class="row">${t}${role?`<button class="btn s" onclick="go(role==='guru'?'guru':'dash')">Beranda</button><button class="btn s" onclick="go('gal')">Galeri</button><button class="btn r" onclick="logout()">Keluar</button>`:""}</span></div>`}
function logout(){me=acc=W=role=null;ls.set("rb_sess",null);go("auth",{tab:"masuk"})}
async function render(){let h="";try{h=await V[view]()}catch(e){h=`<div class="err">Terjadi kesalahan: ${esc(e.message||e)}. <button class="btn" onclick="go('${role==="guru"?"guru":role?"dash":"gate"}')">Muat ulang</button></div>`}app.innerHTML=head()+h;bind()}
const V={
gate(){return `<div class="card hero"><div class="big">🏫📰</div><h1>Rancang Berita</h1><p><b>Rancang Faktanya, Susun Beritanya, Publikasikan Karyanya!</b></p><p>Jelajahi empat misi seru untuk mengubah ide dan fakta di sekitarmu menjadi teks berita yang informatif dan berkualitas.</p><div style="max-width:360px;margin:auto"><label>Password server</label><input id="gp" type="password" placeholder="Masukkan password server" onkeydown="if(event.key==='Enter')gate()"><label class="row"><input type="checkbox" style="width:auto" onchange="gp.type=this.checked?'text':'password'"> Tampilkan password</label><div id="ge"></div><button class="btn" onclick="gate()">Masuk ke Rancang Berita 🚀</button></div></div>`},
auth(){const t=ctx.tab||"masuk";const tabs=`<div class="tabs"><button class="btn ${t==="masuk"?"":"s"}" onclick="go('auth',{tab:'masuk'})">Masuk</button><button class="btn ${t==="daftar"?"":"s"}" onclick="go('auth',{tab:'daftar'})">Buat Akun</button><button class="btn ${t==="guru"?"":"s"}" onclick="go('auth',{tab:'guru'})">Guru</button></div>`;
 const f=(i,l,ty)=>`<label>${l}</label><input id="${i}" type="${ty||"text"}">`;
 const kls=f("kl","Kelas (contoh: XI-7)");
 let b=t==="daftar"?f("nm","Nama lengkap")+f("ab","Nomor absen","number")+kls+f("pw","Password akun","password")+f("pw2","Konfirmasi password","password")+`<button class="btn" onclick="daftar()">Daftar 🎒</button>`
 :t==="guru"?`<label>Nama guru</label><input value="${TEACHER}" readonly>`+f("gpw","Password guru","password")+`<button class="btn" onclick="loginGuru()">Masuk sebagai Guru</button>`
 :f("nm","Nama lengkap")+f("ab","Nomor absen","number")+kls+f("pw","Password","password")+`<button class="btn" onclick="masuk()">Masuk</button>`;
 return `<div class="card"><h2>${t==="daftar"?"Buat Akun Siswa":t==="guru"?"Masuk Guru":"Masuk Siswa"} 🎓</h2>${tabs}<div id="ae"></div><div style="max-width:420px">${b}</div></div>`},
avatar(){return `<div class="card hero"><h2>Pilih Avatarmu!</h2><div class="grid">${["L","P"].map(k=>`<div class="card"><div class="av" style="font-size:5rem">${AV[k]}</div><p>Siswa ${k==="L"?"laki-laki":"perempuan"} berseragam SMA</p><button class="btn ${acc.avatar===k?"y":""}" onclick="setAv('${k}')">${acc.avatar===k?"Dipilih ✅":"Pilih"}</button></div>`).join("")}</div><button class="btn" onclick="go('dash')">Simpan Avatar &amp; Lanjut</button></div>`},
dash(){const tot=5,dn=(W.bahanOk?1:0)+[1,2,3,4].filter(n=>W["m"+n].done).length,pc=dn/tot*100;
 const nodes=MS.map((m,i)=>{const n=i+1,lk=lock(n),s=st(n);return `<div class="node ${s==="Selesai"?"ok":""} ${lk?"lock":""}"><div class="ic">${lk?"🔒":m.ic}</div><b>Misi ${n}</b><div>${m.t}</div><div class="sub">${m.d}</div><span class="badge">${s}</span>${lk?`<div class="sub">${lk}</div>`:`<div><button class="btn" onclick="go('misi',{n:${n},step:'materi'})">${s==="Selesai"?"Buka Ulang":"Buka"}</button></div>`}</div>`}).join("");
 return `<div class="card"><div class="row"><span class="av">${AV[acc.avatar]||"🙂"}</span><div><h2>Halo, ${esc(acc.nama)}! 👋</h2><div class="sub">Kelas ${esc(acc.kelas)} • Absen ${esc(acc.absen)}</div></div></div><p>Progres beritamu: ${dn}/${tot} langkah ⭐</p><div class="bar"><i style="width:${pc}%"></i></div><button class="btn" onclick="go('avatar')">Ganti Avatar</button></div>
 <div class="card"><h2>🗺️ Peta Misi</h2><div class="node ${W.bahanOk?"ok":""}" style="margin-bottom:12px"><div class="ic">🎒</div><b>Siapkan Bahan Beritamu</b><div><span class="badge">${W.bahanOk?"Tersimpan":"Belum diisi"}</span></div><button class="btn y" onclick="go('bahan')">${W.bahanOk?"Edit Bahan Berita":"Isi Bahan Berita"}</button></div><div class="map">${nodes}</div><div style="margin-top:12px"><button class="btn y" onclick="lanjut()">Lanjutkan pekerjaan terakhir ▶️</button><button class="btn s" onclick="go('gal')">Galeri Karya 🖼️</button>${W.m4.done?`<button class="btn" onclick="go('pub')">Pratinjau &amp; Publikasi 📢</button>`:""}</div></div>`},
bahan(){const f=[["judul","Judul sementara berita"],["peristiwa","Peristiwa yang akan diberitakan *",1],["kategori","Jenis/kategori peristiwa"],["lokasi","Lokasi peristiwa *"],["waktu","Tanggal dan waktu peristiwa *"],["pihak","Pihak yang terlibat *",1],["narasumber","Nama/identitas narasumber"],["kutipan","Pernyataan/kutipan narasumber (hanya jika benar-benar ada)",1],["fakta","Fakta atau data pendukung *",1],["kronologi","Kronologi singkat",1],["latar","Alasan/latar belakang peristiwa",1],["sumber","Sumber informasi/bukti pendukung",1]];
 return `<div class="card"><h2>🎒 Siapkan Bahan Beritamu!</h2><p>Tentukan peristiwa yang ingin kamu beritakan. Semua jawabanmu akan menjadi dasar untuk menyelesaikan empat misi.</p><div class="info">Kolom bertanda * wajib. Jika belum tahu, tulis “Belum Diketahui”. Jangan mengarang kutipan atau data!</div><div id="be"></div>${f.map(([k,l,t])=>`<label>${l}</label>${t?ta("bahan."+k):inp("bahan."+k)}`).join("")}<button class="btn" onclick="saveBahan(0)">Simpan Bahan Berita</button><button class="btn y" onclick="saveBahan(1)">Mulai Misi 1 ▶️</button><button class="btn s" onclick="go('dash')">Kembali</button></div>`},
misi(){const n=ctx.n,m=MS[n-1];if(lock(n))return `<div class="err">${lock(n)}</div>`;
 if(ctx.step==="materi")return `<div class="card"><h2>${m.ic} Misi ${n}: ${m.t}</h2>${m.mat}<button class="btn" onclick="go('misi',{n:${n},step:'kerja'})">Kerjakan Misi 🚀</button><button class="btn s" onclick="go('dash')">Peta Misi</button></div>`;
 return `<div class="card"><h2>${m.ic} Misi ${n}: ${["Temukan Fakta dalam Beritamu!","Lengkapi Unsur 5W+1H","Bangun Struktur Beritamu!","Periksa dan Perbaiki Beritamu"][n-1]}</h2>${[k1,k2,k3,k4][n-1]()}<div id="me">${ctx.msg||""}</div><div><button class="btn s" onclick="svDraf()">Simpan Draf</button><button class="btn y" onclick="cek(${n},0)">Periksa</button><button class="btn s" onclick="go('misi',{n:${n},step:'materi'})">Kembali ke Materi</button><button class="btn" onclick="cek(${n},1)">Selesaikan Misi ${n} ${n<4?"dan Lanjutkan":""}</button></div></div>`},
async pub(){const b=W.bahan;return `<div class="card"><h2>📢 Beritamu Siap Dipublikasikan!</h2><label>Font pratinjau</label><select onchange="ctx.font=this.value;render()"><option>Calibri</option><option ${ctx.font==="Times"?"selected":""} value="Times">Times New Roman</option></select><div class="card art ${ctx.font==="Times"?"tnr":""}"><h2>${esc(b.judul||"(Judul belum diisi)")}</h2><div class="sub">Oleh ${esc(acc.nama)} • Kelas ${esc(acc.kelas)} • ${new Date().toLocaleDateString("id-ID",{dateStyle:"long"})}</div>${["k","t","e"].map(x=>`<p>${esc(W.m4[x])}</p>`).join("")}<div class="sub">Narasumber: ${esc(b.narasumber||"-")} • Sumber: ${esc(b.sumber||"-")} • Status: sudah disunting</div></div><div id="pe"></div><button class="btn s" onclick="go('dash')">Kembali dan Edit</button><button class="btn s" onclick="svDraf()">Simpan sebagai Draf</button><button class="btn y" onclick="publish()" ${W.m4.done?"":"disabled"}>Publikasikan Berita 🎉</button></div>`},
async gal(){const all=await S.list("news");const q=(ctx.q||"").toLowerCase(),kl=ctx.kl||"",od=ctx.od||"desc";
 const ks=[...new Set(all.map(x=>x.kelas))];let l=all.filter(x=>(!q||(x.judul+x.nama).toLowerCase().includes(q))&&(!kl||x.kelas===kl)).sort((a,b)=>od==="desc"?b.at-a.at:a.at-b.at);
 return `<div class="card"><h2>🖼️ Galeri Rancang Berita</h2><div class="grid"><input id="gq" placeholder="Cari judul/penulis" value="${esc(ctx.q||"")}" oninput="ctx.q=this.value;clearTimeout(window.gt);window.gt=setTimeout(render,350)"><select onchange="ctx.kl=this.value;render()"><option value="">Semua kelas</option>${ks.map(k=>`<option ${k===kl?"selected":""}>${esc(k)}</option>`).join("")}</select><select onchange="ctx.od=this.value;render()"><option value="desc">Terbaru</option><option value="asc" ${od==="asc"?"selected":""}>Terlama</option></select></div></div><div class="grid">${l.map(x=>`<div class="card"><h3>${esc(x.judul)}</h3><div class="sub">${esc(x.nama)} • ${esc(x.kelas)} • ${new Date(x.at).toLocaleDateString("id-ID")}</div><p>${esc((x.k||"").slice(0,130))}…</p><span class="badge">Terbit</span><div><button class="btn" onclick="go('det',{id:'${x.id}'})">Baca Berita</button></div></div>`).join("")||"<p>Belum ada berita yang dipublikasikan.</p>"}</div>`},
async det(){const x=await S.get("news",ctx.id),g=await S.get("grades",ctx.id);if(!x)return "<div class='err'>Berita tidak ditemukan.</div>";
