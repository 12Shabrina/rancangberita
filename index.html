    <style>
        /* Custom Styles & Cute Animations */
        body {
            font-family: 'Calibri', 'Plus Jakarta Sans', sans-serif;
            background-color: #f0f7ff;
            color: #1e293b;
        }

        .bg-school-pattern {
            background-color: #eef6ff;
            background-image: radial-gradient(#3b82f6 0.75px, transparent 0.75px), radial-gradient(#3b82f6 0.75px, #eef6ff 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            background-opacity: 0.15;
        }

        .bouncy {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .pulse-subtle {
            animation: pulse-slow 3s infinite ease-in-out;
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.95; transform: scale(1.02); }
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb {
            background: #93c5fd;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b82f6;

<body class="min-h-screen bg-school-pattern flex flex-col justify-between antialiased selection:bg-brand-500 selection:text-white">

    <!-- CONFIRMATION / ALERT MODAL -->

            <div class="flex items-center space-x-2">
                <span class="font-extrabold text-brand-900">Rancang Berita</span>
                <span>&bull;</span>
                <span>Guru Pembimbing: <b>Shabrina Luh Nayank Sakti, S.S.</b></span>
            </div>
            <p>&copy; 2026 Platform Pembelajaran Bahasa Indonesia SMA XI. Media Pembelajaran Interaktif.</p>
        </div>

    <!-- MAIN APP SCRIPT -->
    <script>
        /**
         * RANCANG BERITA - Core Full-Stack Browser Application
         * Handles local persistence, state management, UI rendering, multi-user simulation & evaluation rubrics.
         */

        // Initial Server Configuration
        const SERVER_PASSWORD_DEFAULT = "12345678";
        const TEACHER_PASSWORD_DEFAULT = "1234";
        const TEACHER_NAME = "Shabrina Luh Nayank Sakti, S.S.";
        const APP_STORAGE_KEY = "RANCANG_BERITA_DB_V1";
        const SESSION_KEY = "RANCANG_BERITA_SESSION";

        // Predefined Classes
        const CLASS_OPTIONS = [
            "XI-1", "XI-2", "XI-3", "XI-4", "XI-5", "XI-6",
            "XI-7", "XI-8", "XI-9", "XI-10", "XI-11", "XI-12"
        ];

        // Database Schema & State Controller
        class StorageManager {
            static getDb() {
                const data = localStorage.getItem(APP_STORAGE_KEY);
                if (!data) {
                    const initialDb = {
                        serverPassword: SERVER_PASSWORD_DEFAULT,
                        teacherPassword: TEACHER_PASSWORD_DEFAULT,
                        students: [], // { id, name, class, absno, password, avatar }
                        publishedNews: [], // { id, studentId, title, lead, body, ending, category, date, class, authorName, evaluation }
                        drafts: {}, // studentId -> { newsMaterials, mission1, mission2, mission3, mission4, currentMission }
                    };
                    localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(initialDb));
                    return initialDb;
                }
                return JSON.parse(data);
            }

            static saveDb(db) {
                localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(db));
            }

            static exportJSON() {
                const db = this.getDb();
                const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `RancangBerita_Backup_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
            }

            static importJSON(file, callback) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        if (importedData.students && importedData.publishedNews) {
                            localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(importedData));
                            callback(true, "Data server berhasil diimpor!");
                        } else {
                            callback(false, "Format data tidak valid.");
                        }
                    } catch (err) {
                        callback(false, "Gagal membaca berkas JSON.");
                    }
                };
                reader.readAsText(file);
            }
        }

        // SVG Avatar Generators for Cute Highschool UI
        const Avatars = {
            male: `<svg class="w-full h-full" viewBox="0 0 100 100" fill="none">
                <circle cx="50" cy="50" r="50" fill="#DBEAFE"/>
                <path d="M50 20C38 20 30 28 30 40V48C30 50 32 52 35 52H65C68 52 70 50 70 48V40C70 28 62 20 50 20Z" fill="#1E3A8A"/>
                <circle cx="50" cy="46" r="22" fill="#FDE047"/>
                <circle cx="50" cy="48" r="18" fill="#FFEDD5"/>
                <!-- Hair -->
                <path d="M32 38C32 28 40 22 50 22C60 22 68 28 68 38C68 40 65 35 50 35C35 35 32 40 32 38Z" fill="#1E293B"/>
                <!-- Eyes & Smile -->
                <circle cx="43" cy="46" r="2.5" fill="#0F172A"/>
                <circle cx="57" cy="46" r="2.5" fill="#0F172A"/>
                <path d="M45 54C45 54 48 57 50 57C52 57 55 54 55 54" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
                <!-- Uniform Grey Collar & Blue Tie -->
                <path d="M30 75L50 62L70 75V100H30V75Z" fill="#FFFFFF"/>
                <path d="M46 62L50 82L54 62H46Z" fill="#2563EB"/>
                <path d="M25 80C25 70 35 68 50 68C65 68 75 70 75 80V100H25V80Z" fill="#E2E8F0" opacity="0.4"/>
            </svg>`,

            female: `<svg class="w-full h-full" viewBox="0 0 100 100" fill="none">
                <circle cx="50" cy="50" r="50" fill="#FCE7F3"/>
                <circle cx="50" cy="48" r="18" fill="#FFEDD5"/>
                <!-- Hair Long Cute -->
                <path d="M28 42C28 26 36 20 50 20C64 20 72 26 72 42C72 58 68 65 68 65H32C32 65 28 58 28 42Z" fill="#334155"/>
                <circle cx="50" cy="46" r="17" fill="#FFEDD5"/>
                <!-- Bangs -->
                <path d="M33 38C38 32 45 35 50 35C55 35 62 32 67 38C65 30 58 24 50 24C42 24 35 30 33 38Z" fill="#1E293B"/>
                <!-- Eyes & Blush -->
                <circle cx="43" cy="45" r="2.5" fill="#0F172A"/>
                <circle cx="57" cy="45" r="2.5" fill="#0F172A"/>
                <ellipse cx="39" cy="49" rx="3" ry="1.5" fill="#F472B6"/>
                <ellipse cx="61" cy="49" rx="3" ry="1.5" fill="#F472B6"/>
                <path d="M46 52C46 52 48 55 50 55C52 55 54 52 54 52" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
                <!-- School Girl Uniform & Ribbon -->
                <path d="M28 78L50 65L72 78V100H28V78Z" fill="#FFFFFF"/>
                <path d="M47 66L50 72L53 66L50 64L47 66Z" fill="#DC2626"/>
                <path d="M45 68L38 72L44 74L45 68Z" fill="#DC2626"/>
                <path d="M55 68L62 72L56 74L55 68Z" fill="#DC2626"/>
            </svg>`
        };

        // Application Main Engine
        class App {
            constructor() {
                this.db = StorageManager.getDb();
                this.session = JSON.parse(sessionStorage.getItem(SESSION_KEY)) || null; // { authenticated: true/false, user: {...}, isTeacher: bool }
                this.currentFont = 'font-sans';
            }

            init() {
                this.renderNav();
                if (!this.session || !this.session.authenticated) {
                    this.renderServerGate();
                } else if (this.session.isTeacher) {
                    this.renderTeacherDashboard();
                } else {
                    this.renderStudentDashboard();
                }
            }

            saveSession(sessionData) {
                this.session = sessionData;
                sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
                this.renderNav();
            }

            logout() {
                this.confirmModal("Apakah Anda yakin ingin keluar?", () => {
                    this.session = null;
                    sessionStorage.removeItem(SESSION_KEY);
                    this.renderNav();
                    this.showToast("Berhasil keluar dari sesi.", "info");
                    this.renderServerGate();
                });
            }

            showToast(msg, type = 'success') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                const colors = {
                    success: 'bg-emerald-500 text-white',
                    error: 'bg-red-500 text-white',
                    info: 'bg-brand-600 text-white',
                    warning: 'bg-amber-500 text-white'
                };
                const icons = {
                    success: 'fa-circle-check',
                    error: 'fa-triangle-exclamation',
                    info: 'fa-circle-info',
                    warning: 'fa-triangle-exclamation'
                };
                toast.className = `pointer-events-auto flex items-center space-x-3 px-4 py-3 rounded-2xl shadow-xl ${colors[type] || colors.info} transform transition-all duration-300 translate-y-2 text-sm font-bold`;
                toast.innerHTML = `<i class="fa-solid ${icons[type]} text-lg"></i><span>${msg}</span>`;
                container.appendChild(toast);
                setTimeout(() => toast.classList.remove('translate-y-2'), 10);
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-4');
                    setTimeout(() => toast.remove(), 300);
                }, 3500);
            }

            confirmModal(bodyText, onConfirm, title = "Konfirmasi") {
                const modal = document.getElementById('modalOverlay');
                document.getElementById('modalTitle').innerText = title;
                document.getElementById('modalBody').innerText = bodyText;
                const confirmBtn = document.getElementById('modalBtnConfirm');

                // Clone button to strip existing listeners
                const newConfirmBtn = confirmBtn.cloneNode(true);
                confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);

                newConfirmBtn.addEventListener('click', () => {
                    this.closeModal();
                    onConfirm();
                });
                modal.classList.remove('hidden');
            }

            closeModal() {
                document.getElementById('modalOverlay').classList.add('hidden');
            }

            renderNav() {
                const navUser = document.getElementById('navUserArea');
                if (this.session && this.session.user) {
                    navUser.classList.remove('hidden');
                    document.getElementById('navUserName').innerText = this.session.user.name;
                    document.getElementById('navUserSub').innerText = this.session.isTeacher ? 'Guru Pengampu' : `Kelas ${this.session.user.class} (Absen ${this.session.user.absno})`;
                    document.getElementById('navAvatar').innerHTML = this.session.isTeacher ? 
                        `<div class="w-full h-full bg-brand-700 text-white flex items-center justify-center font-bold text-xs"><i class="fa-solid fa-user-tie"></i></div>` :
                        Avatars[this.session.user.avatar || 'male'];
                } else {
                    navUser.classList.add('hidden');
                }
            }

            // ----------------------------------------------------
            // HALAMAN 1 — BERANDA & SERVER ACCESS GATE
            // ----------------------------------------------------
            renderServerGate() {
                const container = document.getElementById('appContainer');
                container.innerHTML = `
                    <div class="max-w-xl mx-auto my-8 bg-white rounded-3xl p-8 shadow-xl border-4 border-brand-100 text-center">
                        <div class="inline-block p-4 bg-brand-50 rounded-3xl mb-4 shadow-inner bouncy">
                            <div class="w-20 h-20 bg-gradient-to-tr from-brand-600 to-brand-400 text-white rounded-2xl flex items-center justify-center text-4xl shadow-md">
                                <i class="fa-solid fa-newspaper"></i>
                            </div>
                        </div>
                        <h2 class="text-3xl font-black text-brand-900 tracking-tight mb-2">Rancang Berita</h2>
                        <p class="text-sm font-bold text-accent-amber mb-4">"Rancang Faktanya, Susun Beritanya, Publikasikan Karyanya!"</p>
                        <p class="text-xs text-gray-600 mb-8 leading-relaxed max-w-md mx-auto">
                            Platform pembelajaran jurnalistik interaktif kelas XI SMA. Bimbingan langkah-demi-langkah menulis berita akurat, faktual, dan sistematis.
                        </p>

                        <!-- Server Access Form -->
                        <form id="serverAuthForm" onsubmit="app.handleServerAuth(event)" class="bg-brand-50/70 p-6 rounded-2xl border-2 border-brand-100 text-left space-y-4">
                            <div>
                                <label class="block text-xs font-extrabold text-brand-900 uppercase tracking-wider mb-2">Masukkan Password Akses Server</label>
                                <div class="relative">
                                    <input type="password" id="serverPasswordInput" required placeholder="Password server..." 
                                        class="w-full px-4 py-3 rounded-xl border-2 border-brand-200 focus:border-brand-600 focus:ring-2 focus:ring-brand-200 outline-none text-sm font-bold text-gray-800 transition">
                                    <button type="button" onclick="app.togglePasswordVisibility('serverPasswordInput', 'passToggleIcon')" 
                                        class="absolute right-3 top-3.5 text-brand-500 hover:text-brand-700">
                                        <i id="passToggleIcon" class="fa-solid fa-eye text-sm"></i>
                                    </button>
                                </div>
                                <p class="text-[11px] text-gray-500 mt-1.5"><i class="fa-solid fa-lock text-brand-500 mr-1"></i>Default Password Server: <code class="bg-brand-200 px-1.5 py-0.5 rounded text-brand-900 font-mono">12345678</code></p>
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-extrabold rounded-xl shadow-lg shadow-brand-500/30 transform hover:-translate-y-0.5 transition active:translate-y-0 flex items-center justify-center space-x-2">
                                <span>Masuk ke Rancang Berita</span>
                                <i class="fa-solid fa-arrow-right text-sm"></i>
                            </button>
                        </form>
                    </div>
                `;
            }

            togglePasswordVisibility(inputId, iconId) {
                const input = document.getElementById(inputId);
                const icon = document.getElementById(iconId);
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'fa-solid fa-eye-slash text-sm';
                } else {
                    input.type = 'password';
                    icon.className = 'fa-solid fa-eye text-sm';
                }
            }

            handleServerAuth(e) {
                e.preventDefault();
                const inputPass = document.getElementById('serverPasswordInput').value.trim();
                const db = StorageManager.getDb();

                if (inputPass === db.serverPassword) {
                    this.showToast("Password server benar!", "success");
                    this.renderAuthChoice();
                } else {
                    this.showToast("Password server salah! Silakan coba lagi.", "error");
                }
            }

            // ----------------------------------------------------
            // HALAMAN 2 — DAFTAR / MASUK SISWA & LOGIN GURU
            // ----------------------------------------------------
            renderAuthChoice() {
                const container = document.getElementById('appContainer');
                container.innerHTML = `
                    <div class="max-w-2xl mx-auto my-6 bg-white rounded-3xl p-6 sm:p-8 shadow-xl border-4 border-brand-100">
                        <!-- Navigation Tabs -->
                        <div class="flex border-b-2 border-brand-100 mb-6 font-bold text-sm">
                            <button id="tabBtnStudentLogin" onclick="app.switchAuthTab('studentLogin')" class="flex-1 py-3 text-center border-b-4 border-brand-600 text-brand-900">Masuk Siswa</button>
                            <button id="tabBtnStudentReg" onclick="app.switchAuthTab('studentReg')" class="flex-1 py-3 text-center border-b-4 border-transparent text-gray-400 hover:text-brand-600">Daftar Akun Siswa</button>
                            <button id="tabBtnTeacher" onclick="app.switchAuthTab('teacherLogin')" class="flex-1 py-3 text-center border-b-4 border-transparent text-amber-500 hover:text-amber-600"><i class="fa-solid fa-user-tie mr-1"></i>Portal Guru</button>
                        </div>

                        <!-- STUDENT LOGIN FORM -->
                        <div id="formStudentLogin" class="space-y-4">
                            <h3 class="text-xl font-extrabold text-brand-900 mb-1">Selamat Datang Kembali!</h3>
                            <p class="text-xs text-gray-500 mb-4">Masukkan nama dan password untuk melanjutkan penulisan berita.</p>
                            <form onsubmit="app.handleStudentLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-brand-900 uppercase mb-1">Nama Lengkap Siswa</label>
                                    <input type="text" id="loginStudentName" required placeholder="Contoh: Budi Santoso" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-brand-600 outline-none text-sm font-semibold">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-brand-900 uppercase mb-1">Password</label>
                                    <input type="password" id="loginStudentPass" required placeholder="Password Anda..." class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-brand-600 outline-none text-sm font-semibold">
                                </div>
                                <button type="submit" class="w-full py-3 bg-brand-600 text-white font-extrabold rounded-xl hover:bg-brand-700 shadow-md transition">Masuk Ke Dashboard</button>
                            </form>
                        </div>

                        <!-- STUDENT REGISTER FORM -->
                        <div id="formStudentReg" class="hidden space-y-4">
                            <h3 class="text-xl font-extrabold text-brand-900 mb-1">Pendaftaran Akun Baru Siswa</h3>
                            <p class="text-xs text-gray-500 mb-4">Isi data diri dengan lengkap sesuai presensi kelas.</p>
                            <form onsubmit="app.handleStudentReg(event)" class="space-y-4">
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-bold text-brand-900 uppercase mb-1">Nama Lengkap</label>
                                        <input type="text" id="regName" required placeholder="Nama lengkap..." class="w-full px-4 py-2.5 rounded-xl border-2 border-gray-200 focus:border-brand-600 outline-none text-sm font-semibold">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-brand-900 uppercase mb-1">Nomor Absen</label>
                                        <input type="number" id="regAbsno" min="1" max="50" required placeholder="Contoh: 14" class="w-full px-4 py-2.5 rounded-xl border-2 border-gray-200 focus:border-brand-600 outline-none text-sm font-semibold">
                                    </div>
                                </div>
                                <div>

            switchAuthTab(tab) {
                const tabs = {
                    studentLogin: { btn: 'tabBtnStudentLogin', form: 'formStudentLogin' },
                    studentReg: { btn: 'tabBtnStudentReg', form: 'formStudentReg' },
                    teacherLogin: { btn: 'tabBtnTeacher', form: 'formTeacherLogin' }
                };

                Object.keys(tabs).forEach(k => {
                    const b = document.getElementById(tabs[k].btn);
                    const f = document.getElementById(tabs[k].form);
                    if (k === tab) {
                        b.className = k === 'teacherLogin' ? 
                            "flex-1 py-3 text-center border-b-4 border-amber-500 text-amber-900 font-extrabold" : 
                            "flex-1 py-3 text-center border-b-4 border-brand-600 text-brand-900 font-extrabold";
                        f.classList.remove('hidden');
                    } else {
                        b.className = "flex-1 py-3 text-center border-b-4 border-transparent text-gray-400 font-bold hover:text-brand-600";
                        f.classList.add('hidden');
                    }
                });
            }

            handleStudentReg(e) {
                e.preventDefault();
                const name = document.getElementById('regName').value.trim();
                const absno = document.getElementById('regAbsno').value.trim();
                const cls = document.getElementById('regClass').value;
                const pass = document.getElementById('regPass').value;
                const passConfirm = document.getElementById('regPassConfirm').value;

                if (pass !== passConfirm) {
                    this.showToast("Konfirmasi password tidak cocok!", "error");
                    return;
                }

                const db = StorageManager.getDb();
                // Check duplicate
                const exists = db.students.some(s => s.name.toLowerCase() === name.toLowerCase() && s.class === cls);
                if (exists) {
                    this.showToast(`Siswa bernama ${name} di kelas ${cls} sudah terdaftar!`, "error");
                    return;
                }

                const newStudent = {
                    id: 'STD_' + Date.now(),
                    name,
                    absno,
                    class: cls,
                    password: pass,
                    avatar: 'male'
                };

                this.tempStudentData = newStudent;
                this.renderAvatarSelection();
            }

                const container = document.getElementById('appContainer');
                container.innerHTML = `

            selectAvatarChoice(choice) {
                this.tempStudentData.avatar = choice;
                const maleCard = document.getElementById('avatarCardMale');
                const femaleCard = document.getElementById('avatarCardFemale');
                if (choice === 'male') {
                    maleCard.className = "cursor-pointer p-4 rounded-2xl border-4 border-brand-600 bg-brand-50 shadow-md scale-105 transition transform";

            completeRegistration() {
                const db = StorageManager.getDb();
                db.students.push(this.tempStudentData);

                // Initialize empty draft structure for new student
                db.drafts[this.tempStudentData.id] = {
                    newsMaterials: null,
                    mission1: null,
                    mission2: null,
                    mission3: null,
                    mission4: null,
                    completedMissions: [],
                };

                StorageManager.saveDb(db);
                this.saveSession({ authenticated: true, user: this.tempStudentData, isTeacher: false });
                this.showToast("Pendaftaran berhasil! Selamat datang.", "success");
                this.renderStudentDashboard();
            }

            handleStudentLogin(e) {
                e.preventDefault();
                const name = document.getElementById('loginStudentName').value.trim();
                const pass = document.getElementById('loginStudentPass').value.trim();
                const db = StorageManager.getDb();

                const student = db.students.find(s => s.name.toLowerCase() === name.toLowerCase() && s.password === pass);
                if (student) {
                    this.saveSession({ authenticated: true, user: student, isTeacher: false });
                    this.showToast(`Selamat datang kembali, ${student.name}!`, "success");
                    this.renderStudentDashboard();
                } else {
                    this.showToast("Nama atau password siswa salah!", "error");
                }
            }

            handleTeacherLogin(e) {
                e.preventDefault();
                const pass = document.getElementById('teacherPassInput').value.trim();
                const db = StorageManager.getDb();

                if (pass === db.teacherPassword) {
                    const teacherUser = { name: TEACHER_NAME, class: 'Semua Kelas', absno: 'GURU' };
                    this.saveSession({ authenticated: true, user: teacherUser, isTeacher: true });
                    this.showToast("Berhasil login sebagai Guru!", "success");
                    this.renderTeacherDashboard();
                } else {
                    this.showToast("Password Guru salah!", "error");
                }
            }

            saveMaterialsForm(e) {
                e.preventDefault();
                const newsMaterials = {
                    title: document.getElementById('matTitle').value.trim(),
                    event: document.getElementById('matEvent').value.trim(),
                    category: document.getElementById('matCategory').value,
                    location: document.getElementById('matLocation').value.trim(),
                    time: document.getElementById('matTime').value.trim(),
                    involved: document.getElementById('matInvolved').value.trim(),
                    source: document.getElementById('matSource').value.trim(),
                    quote: document.getElementById('matQuote').value.trim(),
                    facts: document.getElementById('matFacts').value.trim(),
                    chronology: document.getElementById('matChronology').value.trim(),
                    reason: document.getElementById('matReason').value.trim()
                };

                const db = StorageManager.getDb();
                const studentId = this.session.user.id;
                if (!db.drafts[studentId]) db.drafts[studentId] = { completedMissions: [] };
                db.drafts[studentId].newsMaterials = newsMaterials;

                StorageManager.saveDb(db);
                this.showToast("Bahan berita berhasil disimpan!", "success");
                this.startMission(1);
            }

            startMission(missionNum) {
                if (missionNum === 1) this.renderMission1Material();
                else if (missionNum === 2) this.renderMission2Material();
                else if (missionNum === 3) this.renderMission3Material();
                else if (missionNum === 4) this.renderMission4Material();
            }

            generateFactRow(idx, f) {
                return `
                    <div class="fact-row p-4 bg-brand-50/50 rounded-2xl border border-brand-100 space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-black text-brand-900">Fakta #${idx + 1}</span>
                            <select class="fact-type text-xs font-bold px-2 py-1 rounded-lg border border-brand-300 bg-white">

                                <option value="Perlu Diverifikasi" ${f.type === 'Perlu Diverifikasi' ? 'selected' : ''}>Perlu Diverifikasi</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <input type="text" value="${f.statement || ''}" placeholder="Pernyataan fakta..." class="fact-stmt px-3 py-2 text-xs rounded-xl border border-gray-200 outline-none font-semibold">
                            <input type="text" value="${f.evidence || ''}" placeholder="Bukti / Sumber pendukung..." class="fact-evid px-3 py-2 text-xs rounded-xl border border-gray-200 outline-none font-semibold">
                        </div>
                    </div>
                `;
            }

            addFactRow() {
                const container = document.getElementById('factsContainer');
                const currentRows = container.querySelectorAll('.fact-row').length;
                const div = document.createElement('div');
                div.innerHTML = this.generateFactRow(currentRows, { statement: '', evidence: '', type: 'Fakta' });
                container.appendChild(div.firstElementChild);
            }

            saveMission1(complete = false) {
                const rows = document.querySelectorAll('.fact-row');
                const facts = [];
                rows.forEach(r => {
                    const statement = r.querySelector('.fact-stmt').value.trim();
                    const evidence = r.querySelector('.fact-evid').value.trim();
                    const type = r.querySelector('.fact-type').value;
                    if (statement || evidence) {
                        facts.push({ statement, evidence, type });
                    }
                });

                if (complete) {
                    if (facts.length < 5) {
                        this.showToast("Misi 1 membutuhkan minimal 5 fakta terisi lengkap!", "warning");
                        return;
                    }
                    const validCount = facts.filter(f => f.statement.length > 3 && f.evidence.length > 2).length;
                    if (validCount < 5) {
                        this.showToast("Pastikan kelima fakta memiliki pernyataan & bukti yang jelas!", "warning");
                        return;
                    }
                }

                const db = StorageManager.getDb();
                const studentId = this.session.user.id;
                db.drafts[studentId].mission1 = facts;
                if (complete && !db.drafts[studentId].completedMissions.includes(1)) {
                    db.drafts[studentId].completedMissions.push(1);
                }

                StorageManager.saveDb(db);
                this.showToast(complete ? "Misi 1 Selesai! Misi 2 Terbuka." : "Draf Misi 1 tersimpan.", "success");
                if (complete) this.renderMission2Material();
            }

            generate5WCard(key, title, subtitle, val, notFound) {
                return `
                    <div class="p-4 bg-brand-50/60 rounded-2xl border border-brand-100 space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-black text-brand-900">${title}</span>
                            <label class="flex items-center space-x-1 cursor-pointer text-[11px] text-gray-500 font-semibold">
                                <input type="checkbox" id="chk_${key}" onchange="app.toggle5WNotFound('${key}')" ${notFound ? 'checked' : ''} class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Belum Ditemukan</span>
                            </label>
                        </div>
                        <p class="text-[11px] text-gray-500 font-medium">${subtitle}</p>
                        <textarea id="val_${key}" ${notFound ? 'disabled placeholder="Status: Belum Ditemukan"' : ''} rows="2" class="w-full px-3 py-2 text-xs rounded-xl border border-gray-200 focus:border-brand-600 outline-none font-semibold ${notFound ? 'bg-gray-100 text-gray-400' : 'bg-white'}">${val || ''}</textarea>
                    </div>
                `;
            }

            toggle5WNotFound(key) {
                const chk = document.getElementById(`chk_${key}`).checked;
                const txt = document.getElementById(`val_${key}`);
                txt.disabled = chk;
                if (chk) {
                    txt.classList.add('bg-gray-100', 'text-gray-400');
                    txt.placeholder = "Status: Belum Ditemukan";
                } else {
                    txt.classList.remove('bg-gray-100', 'text-gray-400');
                    txt.placeholder = "Tuliskan unsur di sini...";
                }
            }

            saveMission2(complete = false) {
                const keys = ['what', 'who', 'where', 'when', 'why', 'how'];
                const m2Data = { notFoundFlags: {} };
                let allValid = true;

                keys.forEach(k => {
                    const chk = document.getElementById(`chk_${k}`).checked;
                    const val = document.getElementById(`val_${k}`).value.trim();
                    m2Data.notFoundFlags[k] = chk;
                    m2Data[k] = val;

                    if (!chk && !val) {
                        allValid = false;
                    }
                });

                if (complete && !allValid) {
                    this.showToast("Setiap unsur wajib diisi atau ditandai 'Belum Ditemukan'!", "warning");
                    return;
                }

                const db = StorageManager.getDb();
                const studentId = this.session.user.id;
                db.drafts[studentId].mission2 = m2Data;
                if (complete && !db.drafts[studentId].completedMissions.includes(2)) {
                    db.drafts[studentId].completedMissions.push(2);
                }

                StorageManager.saveDb(db);
                this.showToast(complete ? "Misi 2 Selesai! Misi 3 Terbuka." : "Draf Misi 2 tersimpan.", "success");
                if (complete) this.renderMission3Material();
            }

            countSentences(text) {
                if (!text || text.trim() === '') return 0;
                const matches = text.trim().split(/[.!?]+/).filter(s => s.trim().length > 3);
                return matches.length;

                const ending = document.getElementById('textEnding').value;

                const cBody = this.countSentences(body);
                const cEnding = this.countSentences(ending);

                document.getElementById('leadSentenceCount').innerText = `${cLead} Kalimat (Min. 3)`;
                document.getElementById('bodySentenceCount').innerText = `${cBody} Kalimat (Min. 3)`;
                document.getElementById('endingSentenceCount').innerText = `${cEnding} Kalimat (Min. 3)`;
            }

                const cBody = this.countSentences(body);
                const cEnding = this.countSentences(ending);

            runAISuggestions() {
                const text = document.getElementById('m4LiveEditor').value;
                if (!text || text.trim().length < 10) {
                    this.showToast("Draf berita terlalu pendek untuk diperiksa AI!", "warning");
                    return;
                }

                // Simulated AI Grammar & EYD Rules Engine
                const suggestions = [];
                if (text.includes("dimana")) {
                    suggestions.push({ original: "dimana", replacement: "di mana", reason: "Kata depan 'di' penunjuk tempat wajib dipisah." });
                }
                if (text.includes("diikutsertakan")) {
                    suggestions.push({ original: "diikutsertakan", replacement: "diikutsertakan", reason: "Sudah benar penulisan kata berimbuhan gabung." });
                }
                if (!text.includes('"')) {
                    suggestions.push({ original: "-", replacement: 'Menambahkan Kutipan "..."', reason: "Disarankan menyertakan kalimat langsung narasumber." });
                }
                if (text.includes("yg")) {
                    suggestions.push({ original: "yg", replacement: "yang", reason: "Gunakan kata baku 'yang', hindari singkatan informal." });
                }
                if (text.includes("dgn")) {
                    suggestions.push({ original: "dgn", replacement: "dengan", reason: "Gunakan kata baku 'dengan'." });
                }

                // Generic quality recommendation if clean
                if (suggestions.length === 0) {
                    suggestions.push({ original: "Kaidah Kebahasaan", replacement: "Sesuai Standard", reason: "Ejaan dan struktur secara umum sudah baik & baku." });
                }

                const list = document.getElementById('suggestionsList');
                document.getElementById('sugBadge').innerText = `${suggestions.length} Catatan`;
                list.innerHTML = suggestions.map((s, idx) => `
                    <div class="p-3 bg-white rounded-xl border border-brand-200 space-y-1">
                        <span class="font-extrabold text-brand-900 block">Saran #${idx + 1}</span>
                        <p class="text-gray-600 text-[11px]">${s.reason}</p>
                        ${s.original !== '-' ? `<div class="flex items-center space-x-2 pt-1">
                            <span class="line-through text-red-500 font-bold">${s.original}</span>
                            <i class="fa-solid fa-arrow-right text-[10px] text-gray-400"></i>
                            <span class="text-emerald-600 font-extrabold">${s.replacement}</span>
                        </div>` : ''}
                    </div>
                `).join('');

                this.showToast("Pemeriksaan AI selesai!", "success");
            }

            generateGalleryCard(news) {
                return `
                    <div class="bg-white rounded-3xl p-6 shadow-xl border-2 border-brand-100 flex flex-col justify-between space-y-4 hover:border-brand-300 transition">
                        <div class="space-y-2">
                            <div class="flex items-center justify-between">
                                <span class="px-2.5 py-1 bg-brand-100 text-brand-900 rounded-lg text-[10px] font-black uppercase">${news.category}</span>
                                <span class="text-[10px] font-bold text-gray-400">Kelas ${news.class}</span>
                            </div>
                            <h3 class="font-extrabold text-brand-900 text-lg leading-snug line-clamp-2">${news.title}</h3>
                            <p class="text-xs text-gray-600 leading-relaxed line-clamp-3">${news.content}</p>
                        </div>

                        <div class="pt-4 border-t border-brand-50 flex items-center justify-between">
                            <div class="text-[11px]">
                                <span class="font-bold text-brand-900 block">${news.authorName}</span>
                                <span class="text-gray-400">${new Date(news.date).toLocaleDateString('id-ID')}</span>
                            </div>
                            <button onclick="app.readNewsDetail('${news.id}')" class="px-3.5 py-1.5 bg-brand-50 hover:bg-brand-100 text-brand-700 font-extrabold text-xs rounded-xl transition">Baca Berita</button>
                        </div>
                    </div>
                `;
            }

            filterGallery() {
                const search = document.getElementById('gallerySearch').value.toLowerCase();
                const cls = document.getElementById('galleryClassFilter').value;
                const db = StorageManager.getDb();
                let news = db.publishedNews || [];

                if (cls !== 'ALL') {
                    news = news.filter(n => n.class === cls);
                }
                if (search) {
                    news = news.filter(n => n.title.toLowerCase().includes(search) || n.authorName.toLowerCase().includes(search));
                }

                const grid = document.getElementById('galleryGrid');
                grid.innerHTML = news.length > 0 ? news.map(n => this.generateGalleryCard(n)).join('') : '<p class="text-gray-400 text-xs text-center col-span-full py-12">Tidak ada berita yang sesuai filter.</p>';
            }

            readNewsDetail(newsId) {
                const db = StorageManager.getDb();
                const news = db.publishedNews.find(n => n.id === newsId);
                if (!news) return;

                const container = document.getElementById('appContainer');
                container.innerHTML = `
                    <div class="max-w-3xl mx-auto bg-white rounded-3xl p-6 sm:p-10 shadow-xl border-4 border-brand-100 space-y-6">
                        <button onclick="app.showGallery()" class="px-4 py-2 bg-brand-50 text-brand-700 font-extrabold text-xs rounded-xl hover:bg-brand-100"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Galeri</button>

                        <div class="border-b-2 border-brand-900 pb-4">
                            <span class="px-2.5 py-1 bg-brand-100 text-brand-900 rounded-lg text-xs font-black uppercase">${news.category}</span>
                            <h1 class="text-3xl font-black text-brand-900 mt-2 leading-tight">${news.title}</h1>
                            <p class="text-xs text-gray-500 mt-2 font-semibold">Penulis: <b>${news.authorName}</b> &bull; Kelas: <b>${news.class}</b> &bull; Diterbitkan: <b>${new Date(news.date).toLocaleDateString('id-ID')}</b></p>
                        </div>

                        <div class="text-sm text-gray-800 leading-relaxed whitespace-pre-line font-medium">
                            ${news.content}
                        </div>

                        ${news.evaluation ? `
                            <div class="p-4 bg-amber-50 rounded-2xl border border-amber-200 space-y-2">
                                <h4 class="font-extrabold text-amber-900 text-xs uppercase flex items-center"><i class="fa-solid fa-star text-amber-500 mr-1.5"></i> Penilaian Guru Shabrina: ${news.evaluation.finalScore} / 100</h4>
                                <p class="text-xs text-amber-900 font-medium"><b>Catatan Guru:</b> "${news.evaluation.feedback || 'Sangat baik!'}"</p>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            // ----------------------------------------------------
            // HALAMAN DASHBOARD GURU & EVALUASI
            // ----------------------------------------------------
            renderTeacherDashboard() {
                const db = StorageManager.getDb();
                const students = db.students || [];
                const published = db.publishedNews || [];

                const container = document.getElementById('appContainer');
                container.innerHTML = `
                    <div class="space-y-6">
                        <!-- Dashboard Header -->
                        <div class="bg-gradient-to-r from-amber-600 via-amber-500 to-yellow-500 rounded-3xl p-6 text-white shadow-xl flex flex-col md:flex-row items-center justify-between gap-4">
                            <div>
                                <div class="inline-block px-3 py-1 bg-amber-900/40 text-white font-extrabold text-xs rounded-full uppercase mb-1">
                                    Portal Guru Pengampu
                                </div>
                                <h2 class="text-2xl font-black">${TEACHER_NAME}</h2>
                                <p class="text-xs text-amber-100 mt-0.5">Pantau progres penulisan berita, evaluasi karya siswa, dan impor/ekspor data server.</p>
                            </div>

                            <!-- Data Backup Actions -->
                            <div class="flex space-x-2">
                                <button onclick="StorageManager.exportJSON()" class="px-4 py-2.5 bg-white text-amber-900 font-extrabold text-xs rounded-xl shadow hover:bg-amber-50 transition">
                                    <i class="fa-solid fa-download mr-1"></i> Ekspor Data JSON
                                </button>
                                <label class="px-4 py-2.5 bg-amber-800 hover:bg-amber-900 text-white font-extrabold text-xs rounded-xl shadow cursor-pointer transition">
                                    <i class="fa-solid fa-upload mr-1"></i> Impor Data JSON
                                    <input type="file" accept=".json" onchange="app.handleImportJSON(event)" class="hidden">
                                </label>
                            </div>
                        </div>

                        <!-- Statistics Grid -->
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            <div class="p-4 bg-white rounded-2xl border border-gray-200 shadow-sm">
                                <span class="text-[11px] font-bold text-gray-400 uppercase">Siswa Terdaftar</span>
                                <div class="text-2xl font-black text-brand-900 mt-1">${students.length}</div>
                            </div>
                            <div class="p-4 bg-white rounded-2xl border border-gray-200 shadow-sm">
                                <span class="text-[11px] font-bold text-gray-400 uppercase">Berita Dipublikasi</span>
                                <div class="text-2xl font-black text-emerald-600 mt-1">${published.length}</div>
                            </div>
                            <div class="p-4 bg-white rounded-2xl border border-gray-200 shadow-sm">
                                <span class="text-[11px] font-bold text-gray-400 uppercase">Perlu Dinilai</span>
                                <div class="text-2xl font-black text-amber-500 mt-1">${published.filter(p => !p.evaluation).length}</div>
                            </div>
                            <div class="p-4 bg-white rounded-2xl border border-gray-200 shadow-sm">
                                <span class="text-[11px] font-bold text-gray-400 uppercase">Total Kelas</span>
                                <div class="text-2xl font-black text-brand-600 mt-1">12 Kelas</div>
                            </div>
                        </div>

                        <!-- Student Monitoring Table -->
                        <div class="bg-white rounded-3xl p-6 shadow-xl border-4 border-brand-100 space-y-4">
                            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                                <h3 class="text-lg font-black text-brand-900">Daftar Progres Siswa</h3>
                                <select id="teacherClassFilter" onchange="app.filterTeacherTable()" class="px-3 py-1.5 text-xs rounded-xl border border-gray-200 font-semibold bg-white">
                                    <option value="ALL">Semua Kelas</option>
                                    ${CLASS_OPTIONS.map(c => `<option value="${c}">Kelas ${c}</option>`).join('')}
                                </select>
                            </div>

                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse text-xs">
                                    <thead>
                                        <tr class="bg-brand-50 text-brand-900 border-b border-brand-200 font-black">
                                            <th class="p-3">Nama Siswa</th>
                                            <th class="p-3">Kelas</th>
                                            <th class="p-3">Absen</th>
                                            <th class="p-3 text-center">Progres Misi</th>
                                            <th class="p-3 text-center">Publikasi</th>
                                            <th class="p-3 text-right">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody id="teacherStudentTable">
                                        ${this.generateTeacherTableRows(students, published)}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }

            generateTeacherTableRows(students, published) {
                const db = StorageManager.getDb();
                if (students.length === 0) return `<tr><td colspan="6" class="p-6 text-center text-gray-400">Belum ada siswa terdaftar.</td></tr>`;

                return students.map(s => {
                    const draft = db.drafts[s.id] || {};
                    const completed = draft.completedMissions || [];
                    const pub = published.find(p => p.studentId === s.id);

                    return `
                        <tr class="border-b border-gray-100 hover:bg-gray-50">
                            <td class="p-3 font-bold text-brand-900">${s.name}</td>
                            <td class="p-3 font-semibold text-gray-600">${s.class}</td>
                            <td class="p-3 font-semibold text-gray-600">${s.absno}</td>
                            <td class="p-3 text-center">
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-black ${completed.length === 4 ? 'bg-emerald-100 text-emerald-800' : 'bg-brand-100 text-brand-800'}">${completed.length} / 4 Selesai</span>
                            </td>
                            <td class="p-3 text-center">
                                ${pub ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-black ${pub.evaluation ? 'bg-emerald-500 text-white' : 'bg-amber-400 text-amber-950'}">${pub.evaluation ? 'Sudah Dinilai (' + pub.evaluation.finalScore + ')' : 'Dipublikasi'}</span>` : '<span class="text-gray-400">Belum</span>'}
                            </td>
                            <td class="p-3 text-right">
                                ${pub ? `<button onclick="app.evalStudentPublication('${pub.id}')" class="px-3 py-1 bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-[11px] rounded-lg shadow">Buka & Nilai</button>` : '<span class="text-gray-300 text-[10px]">Menunggu</span>'}
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            filterTeacherTable() {
                const cls = document.getElementById('teacherClassFilter').value;
                const db = StorageManager.getDb();
                let students = db.students || [];

                if (cls !== 'ALL') {
                    students = students.filter(s => s.class === cls);
                }

                document.getElementById('teacherStudentTable').innerHTML = this.generateTeacherTableRows(students, db.publishedNews || []);
            }

            evalStudentPublication(newsId) {
                const db = StorageManager.getDb();
                const news = db.publishedNews.find(n => n.id === newsId);
                if (!news) return;

                const evalData = news.evaluation || { ind1: 4, ind2: 4, ind3: 4, ind4: 4, feedback: '' };

                const container = document.getElementById('appContainer');
                container.innerHTML = `
                    <div class="max-w-4xl mx-auto bg-white rounded-3xl p-6 sm:p-10 shadow-xl border-4 border-amber-200 space-y-6">
                        <button onclick="app.renderTeacherDashboard()" class="px-4 py-2 bg-amber-50 text-amber-800 font-extrabold text-xs rounded-xl hover:bg-amber-100"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Halaman Guru</button>

                        <div class="border-b border-amber-200 pb-4">
                            <span class="px-2.5 py-1 bg-amber-100 text-amber-900 rounded-lg text-xs font-black uppercase">${news.category}</span>
                            <h2 class="text-2xl font-black text-brand-900 mt-2">${news.title}</h2>
                            <p class="text-xs text-gray-500 mt-1">Karya Siswa: <b>${news.authorName}</b> (${news.class})</p>
                        </div>

                        <!-- Read Content -->
                        <div class="p-4 bg-gray-50 rounded-2xl border border-gray-200 text-xs text-gray-800 leading-relaxed whitespace-pre-line font-medium">
                            ${news.content}
                        </div>

                        <!-- Rubric Evaluation Form -->
                        <div class="bg-amber-50/70 p-6 rounded-2xl border-2 border-amber-200 space-y-4">
                            <h3 class="text-base font-black text-amber-950 flex items-center"><i class="fa-solid fa-clipboard-check text-amber-600 mr-2"></i> Rubrik Penilaian Guru Shabrina</h3>
                            
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                                <div>
                                    <label class="block font-bold text-amber-900 mb-1">1. Fakta & Data (Skala 1-4)</label>
                                    <input type="number" id="ind1" min="1" max="4" value="${evalData.ind1}" onchange="app.calcFinalScore()" class="w-full px-3 py-2 rounded-xl border border-amber-300 font-bold">
                                </div>
                                <div>
                                    <label class="block font-bold text-amber-900 mb-1">2. Kelengkapan 5W+1H (Skala 1-4)</label>
                                    <input type="number" id="ind2" min="1" max="4" value="${evalData.ind2}" onchange="app.calcFinalScore()" class="w-full px-3 py-2 rounded-xl border border-amber-300 font-bold">
                                </div>
                                <div>
                                    <label class="block font-bold text-amber-900 mb-1">3. Struktur Lead-Body-Ending (1-4)</label>
                                    <input type="number" id="ind3" min="1" max="4" value="${evalData.ind3}" onchange="app.calcFinalScore()" class="w-full px-3 py-2 rounded-xl border border-amber-300 font-bold">
                                </div>
                                <div>
                                    <label class="block font-bold text-amber-900 mb-1">4. EYD & Kebahasaan (Skala 1-4)</label>
                                    <input type="number" id="ind4" min="1" max="4" value="${evalData.ind4}" onchange="app.calcFinalScore()" class="w-full px-3 py-2 rounded-xl border border-amber-300 font-bold">
                                </div>
                            </div>

                            <div class="pt-2">
                                <label class="block font-bold text-amber-900 text-xs mb-1">Catatan & Umpan Balik Guru</label>
                                <textarea id="evalFeedback" rows="3" placeholder="Tuliskan umpan balik motivatif untuk siswa..." class="w-full px-3 py-2 text-xs rounded-xl border border-amber-300 outline-none font-semibold">${evalData.feedback || ''}</textarea>
                            </div>

                            <div class="flex items-center justify-between pt-2 border-t border-amber-200">
                                <div class="text-xs font-black text-amber-950">
                                    Nilai Akhir Terkonversi: <span id="lblFinalScore" class="text-xl text-emerald-600">100</span> / 100
                                </div>
                                <button onclick="app.saveEvaluation('${news.id}')" class="px-6 py-2.5 bg-amber-600 hover:bg-amber-700 text-white font-extrabold text-xs rounded-xl shadow">Simpan Penilaian</button>
                            </div>
                        </div>
                    </div>
                `;
                this.calcFinalScore();
            }

            calcFinalScore() {
                const i1 = parseInt(document.getElementById('ind1').value) || 1;
                const i2 = parseInt(document.getElementById('ind2').value) || 1;
                const i3 = parseInt(document.getElementById('ind3').value) || 1;
                const i4 = parseInt(document.getElementById('ind4').value) || 1;

                const avg = (i1 + i2 + i3 + i4) / 16;
                const final100 = Math.round(avg * 100);
                document.getElementById('lblFinalScore').innerText = final100;
            }

            saveEvaluation(newsId) {
                const i1 = parseInt(document.getElementById('ind1').value) || 1;
                const i2 = parseInt(document.getElementById('ind2').value) || 1;
                const i3 = parseInt(document.getElementById('ind3').value) || 1;
                const i4 = parseInt(document.getElementById('ind4').value) || 1;
                const feedback = document.getElementById('evalFeedback').value.trim();

                const avg = (i1 + i2 + i3 + i4) / 16;
                const finalScore = Math.round(avg * 100);

                const db = StorageManager.getDb();
                const news = db.publishedNews.find(n => n.id === newsId);
                if (news) {
                    news.evaluation = { ind1: i1, ind2: i2, ind3: i3, ind4: i4, feedback, finalScore };
                    StorageManager.saveDb(db);
                    this.showToast("Penilaian berhasil disimpan!", "success");
                    this.renderTeacherDashboard();
                }
            }

            handleImportJSON(e) {
                const file = e.target.files[0];
                if (!file) return;
                StorageManager.importJSON(file, (success, msg) => {
                    if (success) {
                        this.showToast(msg, "success");
                        this.db = StorageManager.getDb();
                        this.renderTeacherDashboard();
                    } else {
                        this.showToast(msg, "error");
                    }
                });
            }
        }

        // Initialize App Global Scope
        let app;
        window.onload = function() {
            app = new App();
            app.init();
        };
    </script>
</body>
</html>
