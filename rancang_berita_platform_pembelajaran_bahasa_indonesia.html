<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rancang Berita - Platform Pembelajaran Menulis Berita SMA</title>

    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel CDN for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eff6ff',
                100: '#dbeafe',
                500: '#3b82f6',
                700: '#1d4ed8',
                800: '#1e40af',
                900: '#1e3a8a',
              },
              accent: {
                400: '#fbbf24',
                500: '#f59e0b',
                600: '#d97706',
              }
            },
            fontFamily: {
              sans: ['Calibri', 'Segoe UI', 'sans-serif'],
              newspaper: ['Times New Roman', 'Georgia', 'serif'],
            }
          }
        }
      }
    </script>

    <style>
      body {
        font-family: 'Calibri', 'Segoe UI', sans-serif;
        background-color: #f8fafc;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      .newspaper-box {
        background-color: #fffdf9;
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08);
      }
    </style>
</head>
<body class="bg-blue-50/50 text-slate-800 min-h-screen">

    <div id="root"></div>

    <!-- Firebase App & Firestore Scripts -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
      import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
      import { getFirestore, collection, doc, setDoc, getDoc, getDocs, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

      // Fallback Firebase Config for fallback/local development
      const firebaseConfig = typeof __firebase_config !== 'undefined' 
        ? JSON.parse(__firebase_config) 
        : {
            apiKey: "demo-api-key",
            authDomain: "rancang-berita-demo.firebaseapp.com",
            projectId: "rancang-berita-demo",
            storageBucket: "rancang-berita-demo.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:demo"
          };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      window.db = db;
      window.auth = auth;
      window.appId = typeof __app_id !== 'undefined' ? __app_id : 'rancang-berita-app';

      // Auto login anonymous for sync
      signInAnonymously(auth).catch((err) => console.log("Anon auth notice:", err));
    </script>

    <!-- React App Implementation -->
    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      // Class options XI-1 to XI-12
      const CLASS_OPTIONS = Array.from({ length: 12 }, (_, i) => `XI-${i + 1}`);

      // Main App Component
      function App() {
        // App State & Routing
        const [serverAuthenticated, setServerAuthenticated] = useState(false);
        const [user, setUser] = useState(null); // { name, class, absentNo, role: 'student'|'teacher', avatar: 'male'|'female' }
        const [currentView, setCurrentView] = useState('server_access'); // views: server_access, auth, avatar_select, student_dashboard, form_bahan, misi1_materi, misi1_work, misi2_materi, misi2_work, misi3_materi, misi3_work, misi4_materi, misi4_work, preview_publish, gallery, teacher_dashboard, teacher_detail

        // Current Student Drafting News Data
        const [newsDraft, setNewsDraft] = useState({
          id: '',
          title: '',
          event: '',
          category: 'Sekolah',
          location: '',
          datetime: '',
          parties: '',
          sourceName: '',
          sourceQuote: '',
          facts: '',
          chronology: '',
          background: '',
          evidence: '',
          
          // Mission 1: Facts List (min 5)
          factsList: [
            { text: '', source: '', category: 'Fakta' },
            { text: '', source: '', category: 'Fakta' },
            { text: '', source: '', category: 'Fakta' },
            { text: '', source: '', category: 'Fakta' },
            { text: '', source: '', category: 'Fakta' }
          ],

          // Mission 2: 5W+1H
          fiveW1H: {
            what: { text: '', status: 'isi' },
            who: { text: '', status: 'isi' },
            where: { text: '', status: 'isi' },
            when: { text: '', status: 'isi' },
            why: { text: '', status: 'isi' },
            how: { text: '', status: 'isi' }
          },

          // Mission 3: Structure
          structure: {
            lead: '',
            body: '',
            ending: ''
          },

          // Mission 4: Editing
          editedNews: {
            lead: '',
            body: '',
            ending: ''
          },

          // Progress tracker
          missionProgress: {
            bahan: false,
            misi1: false,
            misi2: false,
            misi3: false,
            misi4: false,
            published: false
          }
        });

        // Global Storage of Published News & Student Submissions
        const [allPublishedNews, setAllPublishedNews] = useState([]);
        const [selectedNewsForDetail, setSelectedNewsForDetail] = useState(null);
        
        // Notifications & Modals
        const [toastMessage, setToastMessage] = useState(null);
        const [selectedFont, setSelectedFont] = useState('serif');

        // Check local saved session
        useEffect(() => {
          const savedServer = localStorage.getItem('rb_server_auth');
          if (savedServer === 'true') {
            setServerAuthenticated(true);
            const savedUser = localStorage.getItem('rb_user');
            if (savedUser) {
              const parsedUser = JSON.parse(savedUser);
              setUser(parsedUser);
              if (parsedUser.role === 'teacher') {
                setCurrentView('teacher_dashboard');
              } else {
                setCurrentView('student_dashboard');
              }
            } else {
              setCurrentView('auth');
            }
          }

          // Load local draft if available
          const localDraft = localStorage.getItem('rb_current_draft');
          if (localDraft) {
            setNewsDraft(JSON.parse(localDraft));
          }
        }, []);

        // Save local draft auto sync
        useEffect(() => {
          if (newsDraft.id) {
            localStorage.setItem('rb_current_draft', JSON.stringify(newsDraft));
          }
        }, [newsDraft]);

        // Firebase Sync for Teacher & Gallery
        useEffect(() => {
          if (!window.db) return;
          try {
            const appId = window.appId || 'rancang-berita-app';
            const newsCol = collection(window.db, 'artifacts', appId, 'public', 'data', 'published_news');
            
            const unsubscribe = onSnapshot(newsCol, (snapshot) => {
              const newsList = [];
              snapshot.forEach((docSnap) => {
                newsList.push({ id: docSnap.id, ...docSnap.data() });
              });
              // Sort by date newest first
              newsList.sort((a, b) => new Date(b.publishedAt || 0) - new Date(a.publishedAt || 0));
              setAllPublishedNews(newsList);
            }, (error) => {
              console.log("Firestore sync notice (using local storage fallback):", error);
              // Fallback to localStorage
              const localPublished = localStorage.getItem('rb_published_all');
              if (localPublished) setAllPublishedNews(JSON.parse(localPublished));
            });

            return () => unsubscribe();
          } catch(e) {
            console.log("Firebase listener error:", e);
          }
        }, []);

        // Show toast helper
        const showToast = (msg, type = 'success') => {
          setToastMessage({ msg, type });
          setTimeout(() => setToastMessage(null), 3500);
        };

        // Trigger confetti celebration
        const triggerConfetti = () => {
          if (window.confetti) {
            window.confetti({
              particleCount: 100,
              spread: 70,
              origin: { y: 0.6 }
            });
          }
        };

        // Reset News Draft for starting fresh new news
        const handleStartNewNews = () => {
          const newDraft = {
            id: 'draft_' + Date.now(),
            title: '',
            event: '',
            category: 'Sekolah',
            location: '',
            datetime: '',
            parties: '',
            sourceName: '',
            sourceQuote: '',
            facts: '',
            chronology: '',
            background: '',
            evidence: '',
            factsList: [
              { text: '', source: '', category: 'Fakta' },
              { text: '', source: '', category: 'Fakta' },
              { text: '', source: '', category: 'Fakta' },
              { text: '', source: '', category: 'Fakta' },
              { text: '', source: '', category: 'Fakta' }
            ],
            fiveW1H: {
              what: { text: '', status: 'isi' },
              who: { text: '', status: 'isi' },
              where: { text: '', status: 'isi' },
              when: { text: '', status: 'isi' },
              why: { text: '', status: 'isi' },
              how: { text: '', status: 'isi' }
            },
            structure: { lead: '', body: '', ending: '' },
            editedNews: { lead: '', body: '', ending: '' },
            missionProgress: { bahan: false, misi1: false, misi2: false, misi3: false, misi4: false, published: false }
          };
          setNewsDraft(newDraft);
          localStorage.removeItem('rb_current_draft');
          setCurrentView('form_bahan');
          showToast('Formulir berhasil di-reset! Silakan tulis berita baru.', 'info');
        };

        // Save Evaluation from Teacher
        const handleSaveAssessment = (newsId, gradeData) => {
          const updated = allPublishedNews.map(item => {
            if (item.id === newsId) {
              return { ...item, assessment: gradeData };
            }
            return item;
          });
          setAllPublishedNews(updated);
          localStorage.setItem('rb_published_all', JSON.stringify(updated));

          // Sync to Firebase if available
          if (window.db) {
            try {
              const appId = window.appId || 'rancang-berita-app';
              const docRef = doc(window.db, 'artifacts', appId, 'public', 'data', 'published_news', newsId);
              updateDoc(docRef, { assessment: gradeData });
            } catch(e) {
              console.log("Err updating doc", e);
            }
          }

          showToast('Penilaian dan Umpan Balik berhasil disimpan!');
        };

        // Re-render Lucide icons when view changes
        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, [currentView, user, newsDraft]);

        // ==========================================
        // SUB-COMPONENTS & VIEWS
        // ==========================================

        // 1. Server Access View
        const ServerAccessView = () => {
          const [passInput, setPassInput] = useState('');
          const [showPass, setShowPass] = useState(false);
          const [error, setError] = useState('');

          const handleServerSubmit = (e) => {
            e.preventDefault();
            if (passInput === '1234') {
              setServerAuthenticated(true);
              localStorage.setItem('rb_server_auth', 'true');
              setCurrentView('auth');
              showToast('Akses server berhasil disetujui!');
            } else {
              setError('Password Server salah! Gunakan kode server yang valid.');
            }
          };

          return (
            <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-900 via-brand-800 to-blue-950 text-white">
              <div className="max-w-md w-full bg-white text-slate-800 rounded-3xl p-8 shadow-2xl border border-blue-100 relative overflow-hidden">
                <div className="absolute -right-10 -top-10 w-32 h-32 bg-yellow-400/20 rounded-full blur-xl"></div>
                
                <div className="text-center mb-8">
                  <div className="w-20 h-20 bg-brand-100 text-brand-800 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-inner border border-brand-200">
                    <i data-lucide="newspaper" className="w-10 h-10"></i>
                  </div>
                  <h1 className="text-3xl font-extrabold text-brand-900">Rancang Berita</h1>
                  <p className="text-xs font-semibold uppercase tracking-wider text-brand-700 mt-1">
                    Karya: Shabrina Luh Nayank Sakti, S.S.
                  </p>
                  <p className="text-sm text-slate-600 mt-3 font-medium italic">
                    "Rancang Faktanya, Susun Beritanya, Publikasikan Karyanya!"
                  </p>
                </div>

                <form onSubmit={handleServerSubmit} className="space-y-5">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">
                      Password Server Utama
                    </label>
                    <div className="relative">
                      <input
                        type={showPass ? "text" : "password"}
                        value={passInput}
                        onChange={(e) => { setPassInput(e.target.value); setError(''); }}
                        placeholder="Masukkan Password Server..."
                        className="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none pr-12 font-mono text-center text-lg tracking-wider"
                      />
                      <button
                        type="button"
                        onClick={() => setShowPass(!showPass)}
                        className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1"
                      >
                        <i data-lucide={showPass ? "eye-off" : "eye"} className="w-5 h-5"></i>
                      </button>
                    </div>
                    {error && <p className="text-red-500 text-xs mt-2 font-medium">{error}</p>}
                    <p className="text-[11px] text-slate-500 mt-2 text-center">
                      *Gunakan password server: <strong className="text-brand-700">1234</strong>
                    </p>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3.5 bg-brand-800 hover:bg-brand-900 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2"
                  >
                    <span>Masuk ke Rancang Berita</span>
                    <i data-lucide="arrow-right" className="w-5 h-5"></i>
                  </button>
                </form>

                <div className="mt-8 pt-4 border-t border-slate-100 text-center">
                  <span className="inline-block px-3 py-1 bg-yellow-100 text-yellow-800 rounded-full text-xs font-bold">
                    SMA Interaktif Bahasa Indonesia
                  </span>
                </div>
              </div>
            </div>
          );
        };

        // 2. Auth & Student/Teacher Selection
        const AuthView = () => {
          const [mode, setMode] = useState('student'); // student | teacher
          
          // Student Form State
          const [studentName, setStudentName] = useState('');
          const [studentClass, setStudentClass] = useState('XI-1');
          const [absentNo, setAbsentNo] = useState('');
          const [studentPass, setStudentPass] = useState('');

          // Teacher Form State
          const [teacherPass, setTeacherPass] = useState('');
          const [teacherError, setTeacherError] = useState('');

          const handleStudentAuth = (e) => {
            e.preventDefault();
            if (!studentName.trim() || !absentNo || !studentPass) {
              showToast('Mohon lengkapi seluruh kolom formulir!', 'error');
              return;
            }

            const userData = {
              name: studentName.trim(),
              class: studentClass,
              absentNo: absentNo,
              role: 'student',
              avatar: 'male' // default
            };
            setUser(userData);
            localStorage.setItem('rb_user', JSON.stringify(userData));
            
            // Check if draft initialized
            if (!newsDraft.id) {
              setNewsDraft(prev => ({ ...prev, id: 'draft_' + Date.now() }));
            }

            setCurrentView('avatar_select');
          };

          const handleTeacherAuth = (e) => {
            e.preventDefault();
            if (teacherPass === '1234') {
              const teacherUser = {
                name: 'Shabrina Luh Nayank Sakti, S.S.',
                role: 'teacher',
                title: 'Guru Pengampu Bahasa Indonesia'
              };
              setUser(teacherUser);
              localStorage.setItem('rb_user', JSON.stringify(teacherUser));
              setCurrentView('teacher_dashboard');
              showToast('Selamat datang Guru Shabrina!');
            } else {
              setTeacherError('Password Guru salah! (Gunakan: 1234)');
            }
          };

          return (
            <div className="min-h-screen flex items-center justify-center p-4 bg-blue-50">
              <div className="max-w-xl w-full bg-white rounded-3xl p-8 shadow-xl border border-blue-100">
                <div className="flex bg-slate-100 p-1.5 rounded-2xl mb-8">
                  <button
                    onClick={() => setMode('student')}
                    className={`flex-1 py-2.5 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 ${
                      mode === 'student' ? 'bg-white text-brand-800 shadow-md' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <i data-lucide="user-check" className="w-4 h-4"></i>
                    <span>Akses Siswa</span>
                  </button>
                  <button
                    onClick={() => setMode('teacher')}
                    className={`flex-1 py-2.5 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 ${
                      mode === 'teacher' ? 'bg-white text-brand-800 shadow-md' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <i data-lucide="award" className="w-4 h-4"></i>
                    <span>Akses Guru (Shabrina, S.S.)</span>
                  </button>
                </div>

                {mode === 'student' ? (
                  <form onSubmit={handleStudentAuth} className="space-y-4">
                    <div className="text-center mb-6">
                      <h2 className="text-2xl font-extrabold text-brand-900">Masuk Portal Siswa</h2>
                      <p className="text-xs text-slate-500 mt-1">Isi identitas diri untuk memulai misi jurnalistikmu!</p>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Nama Lengkap Siswa</label>
                      <input
                        type="text"
                        required
                        value={studentName}
                        onChange={e => setStudentName(e.target.value)}
                        placeholder="Contoh: Budi Santoso"
                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Pilih Kelas</label>
                        <select
                          value={studentClass}
                          onChange={e => setStudentClass(e.target.value)}
                          className="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none font-bold text-brand-800"
                        >
                          {CLASS_OPTIONS.map(c => (
                            <option key={c} value={c}>{c}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Nomor Absen</label>
                        <input
                          type="number"
                          required
                          min="1"
                          max="50"
                          value={absentNo}
                          onChange={e => setAbsentNo(e.target.value)}
                          placeholder="Nomor Absen..."
                          className="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Password Akun Siswa</label>
                      <input
                        type="password"
                        required
                        value={studentPass}
                        onChange={e => setStudentPass(e.target.value)}
                        placeholder="Masukkan password bebas..."
                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full mt-4 py-3 bg-brand-800 hover:bg-brand-900 text-white font-bold rounded-xl shadow-lg transition-all flex items-center justify-center gap-2"
                    >
                      <span>Lanjutkan Pilih Avatar</span>
                      <i data-lucide="arrow-right" className="w-5 h-5"></i>
                    </button>
                  </form>
                ) : (
                  <form onSubmit={handleTeacherAuth} className="space-y-4 py-4">
                    <div className="text-center mb-6">
                      <div className="w-16 h-16 bg-yellow-100 text-yellow-700 rounded-full flex items-center justify-center mx-auto mb-2 border border-yellow-300">
                        <i data-lucide="shield-check" className="w-8 h-8"></i>
                      </div>
                      <h2 className="text-2xl font-extrabold text-brand-900">Login Guru Pengampu</h2>
                      <p className="text-xs text-slate-600 mt-1 font-semibold">Guru Shabrina Luh Nayank Sakti, S.S.</p>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Password Otentikasi Guru</label>
                      <input
                        type="password"
                        required
                        value={teacherPass}
                        onChange={e => { setTeacherPass(e.target.value); setTeacherError(''); }}
                        placeholder="Password Guru..."
                        className="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 text-center font-mono text-lg"
                      />
                      {teacherError && <p className="text-red-500 text-xs mt-2 text-center font-semibold">{teacherError}</p>}
                      <p className="text-[11px] text-slate-500 mt-2 text-center">
                        *Gunakan Password Guru: <strong className="text-brand-800">1234</strong>
                      </p>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 bg-brand-800 hover:bg-brand-900 text-white font-bold rounded-xl shadow-lg transition-all flex items-center justify-center gap-2"
                    >
                      <span>Masuk Portal Penilaian Guru</span>
                      <i data-lucide="arrow-right" className="w-5 h-5"></i>
                    </button>
                  </form>
                )}
              </div>
            </div>
          );
        };

        // 3. Avatar Select View
        const AvatarSelectView = () => {
          const [selected, setSelected] = useState(user?.avatar || 'male');

          const handleSave = () => {
            const updatedUser = { ...user, avatar: selected };
            setUser(updatedUser);
            localStorage.setItem('rb_user', JSON.stringify(updatedUser));
            setCurrentView('student_dashboard');
            showToast('Avatar berhasil disimpan!');
          };

          return (
            <div className="min-h-screen flex items-center justify-center p-4 bg-blue-50">
              <div className="max-w-md w-full bg-white rounded-3xl p-8 shadow-xl text-center border border-blue-100">
                <h2 className="text-2xl font-extrabold text-brand-900 mb-2">Pilih Avatar Seragam SMA</h2>
                <p className="text-xs text-slate-500 mb-6">Pilih karakter jurnalis SMA yang mewakili dirimu!</p>

                <div className="grid grid-cols-2 gap-4 mb-8">
                  <div
                    onClick={() => setSelected('male')}
                    className={`cursor-pointer p-5 rounded-2xl border-2 transition-all text-center ${
                      selected === 'male' ? 'border-brand-600 bg-blue-50/80 shadow-md scale-105' : 'border-slate-200 hover:border-slate-300'
                    }`}
                  >
                    <div className="w-24 h-24 mx-auto mb-3 bg-blue-100 rounded-full flex items-center justify-center text-4xl shadow-inner">
                      👨‍🎓
                    </div>
                    <span className="block font-bold text-slate-800 text-sm">Siswa Putra</span>
                    <span className="text-[11px] text-slate-500">Seragam Putih Abu-abu</span>
                  </div>

                  <div

                        {newsDraft.title || 'Judul Berita'}

                      <div className="flex flex-wrap items-center justify-center gap-4 text-xs font-semibold text-slate-600 border-t border-b border-slate-200 py-2">
                        <span>Penulis: <strong>{user?.name} ({user?.class})</strong></span>
                        <span>•</span>
                        <span>Lokasi: <strong>{newsDraft.location}</strong></span>
                        <span>•</span>
                        <span>Waktu: <strong>{newsDraft.datetime}</strong></span>
                      </div>
                    </div>

                    {/* Newspaper Content */}
                    <div className="space-y-4 text-slate-900 leading-relaxed text-base sm:text-lg">
                      <p className="first-letter:text-4xl first-letter:font-black first-letter:mr-1 first-letter:float-left first-letter:text-brand-900 font-semibold">
                        {newsDraft.editedNews.lead || newsDraft.structure.lead}
                      </p>

                      <p>
                        {newsDraft.editedNews.body || newsDraft.structure.body}
                      </p>

                      <p className="text-slate-800">
                        {newsDraft.editedNews.ending || newsDraft.structure.ending}
                      </p>

                      {newsDraft.sourceName && (
                        <div className="mt-6 pt-4 border-t border-slate-200 text-xs italic text-slate-600">
                          Narasumber Atribusi: <strong>{newsDraft.sourceName}</strong>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Publish Button */}
                  <div className="bg-white p-6 rounded-3xl shadow-lg border border-blue-100 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div>
                      <h4 className="font-extrabold text-brand-900">Publikasikan Berita Sekarang?</h4>
                      <p className="text-xs text-slate-500">Berita akan dikirimkan ke Dashboard Guru Shabrina dan Galeri Sekolah.</p>
                    </div>

                    <button
                      disabled={isPublishing}
                      onClick={handlePublishNow}
                      className="px-8 py-3.5 bg-green-600 hover:bg-green-700 text-white font-extrabold rounded-2xl text-xs shadow-lg transition-all flex items-center gap-2"
                    >
                      <i data-lucide="send" className="w-4 h-4"></i>
                      <span>{isPublishing ? 'Mempublikasikan...' : 'Publikasikan Berita'}</span>
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        };

        // 11. Gallery View (All Published News)
        const GalleryView = () => {
          const [selectedClassFilter, setSelectedClassFilter] = useState('ALL');
          const [searchTerm, setSearchTerm] = useState('');

          const filteredNews = allPublishedNews.filter(item => {
            const matchClass = selectedClassFilter === 'ALL' || item.studentClass === selectedClassFilter;
            const matchSearch = item.title?.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                item.studentName?.toLowerCase().includes(searchTerm.toLowerCase());
            return matchClass && matchSearch;
          });

          return (
            <div className="max-w-6xl mx-auto px-4 py-8">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div>
                  <h2 className="text-3xl font-extrabold text-brand-900">Galeri Berita Karya Siswa</h2>
                  <p className="text-xs text-slate-500">Kumpulan karya berita jurnalistik siswa SMA dari Kelas XI-1 sampai XI-12.</p>
                </div>

                <div className="flex flex-wrap items-center gap-3">
                  <div className="relative">
                    <input
                      type="text"
                      value={searchTerm}
                      onChange={e => setSearchTerm(e.target.value)}
                      placeholder="Cari judul / nama siswa..."
                      className="pl-9 pr-4 py-2 bg-white border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-brand-500"
                    />
                    <i data-lucide="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                  </div>

                  <select
                    value={selectedClassFilter}
                    onChange={e => setSelectedClassFilter(e.target.value)}
                    className="px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs font-bold text-brand-800"
                  >
                    <option value="ALL">Semua Kelas XI</option>
                    {CLASS_OPTIONS.map(c => (
                      <option key={c} value={c}>Kelas {c}</option>
                    ))}
                  </select>
                </div>
              </div>

              {filteredNews.length === 0 ? (
                <div className="bg-white rounded-3xl p-12 text-center text-slate-500 border border-slate-200">
                  <i data-lucide="newspaper" className="w-12 h-12 mx-auto mb-3 text-slate-300"></i>
                  <p className="font-bold text-slate-700">Belum Ada Berita Dipublikasikan</p>
                  <p className="text-xs text-slate-400 mt-1">Jadilah yang pertama menulis dan mempublikasikan berita!</p>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredNews.map(news => (
                    <div key={news.id} className="bg-white rounded-3xl p-6 shadow-md border border-slate-200 hover:shadow-xl transition-all flex flex-col justify-between">
                      <div>
                        <div className="flex items-center justify-between mb-3">
                          <span className="px-3 py-1 bg-blue-100 text-brand-800 font-extrabold text-[11px] rounded-full">
                            Kelas {news.studentClass}
                          </span>
                          <span className="text-[11px] text-slate-400">
                            {new Date(news.publishedAt).toLocaleDateString('id-ID')}
                          </span>
                        </div>

                        <h3 className="font-extrabold text-slate-900 text-lg line-clamp-2 mb-2">
                          {news.title}
                        </h3>

                        <p className="text-xs text-slate-600 line-clamp-3 mb-4 leading-relaxed font-newspaper">
                          {news.lead}
                        </p>
                      </div>

                      <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
                        <div className="flex items-center gap-2">
                          <span className="text-lg">
                            {news.avatar === 'female' ? '👩‍🎓' : '👨‍🎓'}
                          </span>
                          <span className="text-xs font-bold text-slate-800">{news.studentName}</span>
                        </div>

                        {news.assessment ? (
                          <span className="px-2.5 py-1 bg-green-100 text-green-800 rounded-lg text-xs font-extrabold">
                            Nilai: {news.assessment.finalScore}
                          </span>
                        ) : (
                          <span className="text-[10px] text-slate-400 italic">Menunggu Penilaian</span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        };

        // 12. Teacher Dashboard (Guru Shabrina Luh Nayank Sakti, S.S.)
        const TeacherDashboardView = () => {
          const [selectedClass, setSelectedClass] = useState('ALL');
          const [searchQuery, setSearchQuery] = useState('');

          const filteredList = allPublishedNews.filter(item => {
            const matchClass = selectedClass === 'ALL' || item.studentClass === selectedClass;
            const matchQuery = item.studentName?.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              item.title?.toLowerCase().includes(searchQuery.toLowerCase());
            return matchClass && matchQuery;
          });

          return (
            <div className="max-w-7xl mx-auto px-4 py-8">
              {/* Teacher Welcome Header */}
              <div className="bg-gradient-to-r from-brand-900 to-blue-800 text-white rounded-3xl p-6 sm:p-8 shadow-xl mb-8 relative overflow-hidden">
                <div className="flex flex-col sm:flex-row items-center gap-6 relative z-10">
                  <div className="w-20 h-20 bg-white/10 rounded-2xl flex items-center justify-center text-4xl shadow-inner border border-white/20">
                    👩‍🏫
                  </div>
                  <div>
                    <span className="px-3 py-1 bg-yellow-400 text-slate-900 rounded-full text-xs font-black tracking-wide inline-block mb-1">
                      PORTAL GURU PENGAMPU
                    </span>
                    <h2 className="text-2xl sm:text-3xl font-extrabold">Shabrina Luh Nayank Sakti, S.S.</h2>
                    <p className="text-xs text-blue-100 mt-1">
                      Pantau seluruh karya tulisan berita siswa dari Kelas XI-1 hingga XI-12 secara terpusat.
                    </p>
                  </div>
                </div>
              </div>

              {/* Statistics Overview */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-8">
                <div className="bg-white p-5 rounded-2xl border border-blue-100 shadow-sm flex items-center gap-4">
                  <div className="w-12 h-12 bg-blue-100 text-brand-800 rounded-xl flex items-center justify-center text-xl font-bold">
                    📰
                  </div>
                  <div>
                    <span className="text-xs font-bold text-slate-500 uppercase">Total Berita Terpublikasi</span>
                    <h3 className="text-2xl font-black text-brand-900">{allPublishedNews.length}</h3>
                  </div>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-blue-100 shadow-sm flex items-center gap-4">
                  <div className="w-12 h-12 bg-green-100 text-green-800 rounded-xl flex items-center justify-center text-xl font-bold">
                    ✅
                  </div>
                  <div>
                    <span className="text-xs font-bold text-slate-500 uppercase">Karya Sudah Dinilai</span>
                    <h3 className="text-2xl font-black text-green-700">
                      {allPublishedNews.filter(n => n.assessment).length}
                    </h3>
                  </div>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-blue-100 shadow-sm flex items-center gap-4">
                  <div className="w-12 h-12 bg-amber-100 text-amber-800 rounded-xl flex items-center justify-center text-xl font-bold">
                    ⏳
                  </div>
                  <div>
                    <span className="text-xs font-bold text-slate-500 uppercase">Perlu Penilaian</span>
                    <h3 className="text-2xl font-black text-amber-600">
                      {allPublishedNews.filter(n => !n.assessment).length}
                    </h3>
                  </div>
                </div>
              </div>

              {/* Filter & Controls */}
              <div className="bg-white p-6 rounded-3xl shadow-lg border border-blue-100 mb-8">
                <div className="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
                  <h3 className="font-extrabold text-xl text-brand-900">Daftar Publikasi Siswa</h3>

                  <div className="flex flex-wrap items-center gap-3">
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={e => setSearchQuery(e.target.value)}
                      placeholder="Cari nama siswa / judul..."
                      className="px-4 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-brand-500"
                    />

                    <select
                      value={selectedClass}
                      onChange={e => setSelectedClass(e.target.value)}
                      className="px-4 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold text-brand-800"
                    >
                      <option value="ALL">Semua Kelas XI (XI-1 s.d XI-12)</option>
                      {CLASS_OPTIONS.map(c => (
                        <option key={c} value={c}>Kelas {c}</option>
                      ))}
                    </select>
                  </div>
                </div>

                {/* Submissions Table */}
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="border-b border-slate-200 text-xs font-black text-slate-600 uppercase tracking-wider bg-slate-50">
                        <th className="p-3">Siswa</th>
                        <th className="p-3">Kelas / Absen</th>
                        <th className="p-3">Judul Berita</th>
                        <th className="p-3">Waktu Terbit</th>
                        <th className="p-3">Status Penilaian</th>
                        <th className="p-3 text-right">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 text-xs font-medium">
                      {filteredList.length === 0 ? (
                        <tr>
                          <td colSpan="6" className="p-8 text-center text-slate-400">
                            Tidak ditemukan data berita siswa yang sesuai.
                          </td>
                        </tr>
                      ) : (
                        filteredList.map(news => (
                          <tr key={news.id} className="hover:bg-blue-50/50 transition-all">
                            <td className="p-3">
                              <div className="flex items-center gap-2">
                                <span className="text-base">{news.avatar === 'female' ? '👩‍🎓' : '👨‍🎓'}</span>
                                <span className="font-bold text-slate-800">{news.studentName}</span>
                              </div>
                            </td>
                            <td className="p-3 font-bold text-brand-800">
                              Kelas {news.studentClass} (Absen {news.absentNo})
                            </td>
                            <td className="p-3 max-w-xs truncate font-semibold text-slate-700">
                              {news.title}
                            </td>
                            <td className="p-3 text-slate-500">
                              {new Date(news.publishedAt).toLocaleString('id-ID')}
                            </td>
                            <td className="p-3">
                              {news.assessment ? (
                                <span className="px-2.5 py-1 bg-green-100 text-green-800 rounded-md font-bold text-[11px]">
                                  Nilai: {news.assessment.finalScore} / 100
                                </span>
                              ) : (
                                <span className="px-2.5 py-1 bg-yellow-100 text-yellow-800 rounded-md font-bold text-[11px]">
                                  Belum Dinilai
                                </span>
                              )}
                            </td>
                            <td className="p-3 text-right">
                              <button
                                onClick={() => {
                                  setSelectedNewsForDetail(news);
                                  setCurrentView('teacher_detail');
                                }}
                                className="px-3 py-1.5 bg-brand-800 hover:bg-brand-900 text-white rounded-lg font-bold text-xs"
                              >
                                Baca & Nilai
                              </button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          );
        };

        // 13. Teacher Detail & Grading View
        const TeacherDetailView = () => {
          if (!selectedNewsForDetail) return null;

          const news = selectedNewsForDetail;

          // Evaluation Indicators (1-4 scale)
          const [scores, setScores] = useState(news.assessment?.scores || {
            facts: 4,
            elements: 4,
            structure: 4,
            grammar: 4,
            editing: 4
          });

          const [feedback, setFeedback] = useState(news.assessment?.feedback || '');

          // Calculate final score out of 100
          const finalScore = useMemo(() => {
            const sum = scores.facts + scores.elements + scores.structure + scores.grammar + scores.editing;
            // Max score sum is 20, (sum / 20) * 100
            return Math.round((sum / 20) * 100);
          }, [scores]);

          const saveGrading = () => {
            handleSaveAssessment(news.id, {
              scores,
              finalScore,
              feedback,
              gradedAt: new Date().toISOString()
            });
            setCurrentView('teacher_dashboard');
          };

          return (
            <div className="max-w-5xl mx-auto px-4 py-8">
              <div className="flex items-center justify-between mb-6">
                <button
                  onClick={() => setCurrentView('teacher_dashboard')}
                  className="px-4 py-2 bg-slate-200 text-slate-700 font-bold rounded-xl text-xs flex items-center gap-2"
                >
                  <i data-lucide="arrow-left" className="w-4 h-4"></i>
                  <span>Kembali ke Dashboard Guru</span>
                </button>
                <span className="text-xs text-slate-500 font-bold">
                  Karya Siswa: {news.studentName} ({news.studentClass})
                </span>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                {/* Left 2 Cols: News Reading */}
                <div className="lg:col-span-2 space-y-6">
                  <div className="bg-white p-8 rounded-3xl shadow-lg border border-slate-200 newspaper-box font-newspaper">
                    <span className="text-xs font-bold text-brand-800 uppercase tracking-wider block mb-1">
                      Kategori: {news.category}
                    </span>
                    <h1 className="text-2xl sm:text-3xl font-black text-slate-900 mb-3">{news.title}</h1>
                    <p className="text-xs text-slate-500 mb-6 font-sans">
                      Diterbitkan pada: {new Date(news.publishedAt).toLocaleString('id-ID')}
                    </p>

                    <div className="space-y-4 text-base leading-relaxed text-slate-900">
                      <p className="font-semibold">{news.lead}</p>
                      <p>{news.body}</p>
                      <p>{news.ending}</p>
                    </div>
                  </div>
                </div>

                {/* Right 1 Col: Grading Form */}
                <div className="bg-white p-6 rounded-3xl shadow-xl border border-blue-100 space-y-6">
                  <div className="pb-4 border-b border-slate-100">
                    <h3 className="font-extrabold text-xl text-brand-900">Form Penilaian Guru</h3>
                    <p className="text-xs text-slate-500">Skala Nilai 1 - 4 per Indikator</p>
                  </div>

                  <div className="space-y-4 text-xs font-bold">
                    {/* Indikator 1 */}
                    <div>
                      <label className="block text-slate-700 mb-1">1. Ketepatan & Kelengkapan Fakta</label>
                      <select
                        value={scores.facts}
                        onChange={e => setScores({ ...scores, facts: Number(e.target.value) })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl"
                      >
                        <option value={4}>4 - Sangat Tepat & Akurat</option>
                        <option value={3}>3 - Tepat</option>
                        <option value={2}>2 - Cukup Fakta</option>
                        <option value={1}>1 - Kurang Fakta</option>
                      </select>
                    </div>

                    {/* Indikator 2 */}
                    <div>
                      <label className="block text-slate-700 mb-1">2. Kelengkapan Unsur 5W + 1H</label>
                      <select
                        value={scores.elements}
                        onChange={e => setScores({ ...scores, elements: Number(e.target.value) })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl"
                      >
                        <option value={4}>4 - Lengkap 6 Unsur</option>
                        <option value={3}>3 - Cukup Lengkap</option>
                        <option value={2}>2 - Sebagian Unsur</option>
                        <option value={1}>1 - Sangat Kurang</option>
                      </select>
                    </div>

                    {/* Indikator 3 */}
                    <div>
                      <label className="block text-slate-700 mb-1">3. Struktur Berita (Piramida Terbalik)</label>
                      <select
                        value={scores.structure}
                        onChange={e => setScores({ ...scores, structure: Number(e.target.value) })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl"
                      >
                        <option value={4}>4 - Struktur Rapi & Padu</option>
                        <option value={3}>3 - Cukup Rapi</option>
                        <option value={2}>2 - Kurang Padu</option>
                        <option value={1}>1 - Tidak Terstruktur</option>
                      </select>
                    </div>

                    {/* Indikator 4 */}
                    <div>
                      <label className="block text-slate-700 mb-1">4. Kaidah Kebahasaan (EYD & Verba)</label>
                      <select
                        value={scores.grammar}
                        onChange={e => setScores({ ...scores, grammar: Number(e.target.value) })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl"
                      >
                        <option value={4}>4 - Sangat Sesuai EYD</option>
                        <option value={3}>3 - Cukup Sesuai</option>
                        <option value={2}>2 - Banyak Tipografi</option>
                        <option value={1}>1 - Tidak Sesuai</option>
                      </select>
                    </div>

                    {/* Indikator 5 */}
                    <div>
                      <label className="block text-slate-700 mb-1">5. Penyuntingan & Keterbacaan</label>
                      <select
                        value={scores.editing}
                        onChange={e => setScores({ ...scores, editing: Number(e.target.value) })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl"
                      >
                        <option value={4}>4 - Sangat Nyaman Dibaca</option>
                        <option value={3}>3 - Baik</option>
                        <option value={2}>2 - Sedang</option>
                        <option value={1}>1 - Perlu Perbaikan</option>
                      </select>
                    </div>

                    {/* Final Calculated Score */}
                    <div className="p-4 bg-yellow-100 rounded-2xl border border-yellow-300 text-center">
                      <span className="text-xs font-black text-yellow-900 uppercase block">Kalkulasi Nilai Akhir (Skala 100)</span>
                      <span className="text-3xl font-black text-brand-900">{finalScore} / 100</span>
                    </div>

                    {/* Feedback Column */}
                    <div>
                      <label className="block text-slate-700 mb-1">Catatan & Umpan Balik Guru Shabrina</label>
                      <textarea
                        rows="3"
                        value={feedback}
                        onChange={e => setFeedback(e.target.value)}
                        placeholder="Tuliskan umpan balik apresiasi & motivasi untuk siswa..."
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs"
                      ></textarea>
                    </div>
                  </div>

                  <button
                    onClick={saveGrading}
                    className="w-full py-3 bg-brand-800 hover:bg-brand-900 text-white font-bold rounded-xl text-xs shadow-md transition-all"
                  >
                    Simpan Penilaian Siswa
                  </button>
                </div>
              </div>
            </div>
          );
        };

        // Render main active view based on routing state
        return (
          <div className="min-h-screen flex flex-col justify-between">
            {/* Toast Notification Popup */}
            {toastMessage && (
              <div className={`fixed bottom-5 right-5 z-50 px-5 py-3 rounded-2xl shadow-2xl font-bold text-xs flex items-center gap-2 transition-all ${
                toastMessage.type === 'error' ? 'bg-red-600 text-white' : 'bg-slate-900 text-white'
              }`}>
                <span>{toastMessage.msg}</span>
              </div>
            )}

            {!serverAuthenticated ? (
              <ServerAccessView />
            ) : (
              <>
                <Header />
                <main className="flex-grow">
                  {currentView === 'auth' && <AuthView />}
                  {currentView === 'avatar_select' && <AvatarSelectView />}
                  {currentView === 'student_dashboard' && <StudentDashboardView />}
                  {currentView === 'form_bahan' && <FormBahanView />}
                  {currentView === 'misi1_materi' && <Misi1MateriView />}
                  {currentView === 'misi1_work' && <Misi1WorkView />}
                  {currentView === 'misi2_materi' && <Misi2MateriView />}
                  {currentView === 'misi2_work' && <Misi2WorkView />}
                  {currentView === 'misi3_materi' && <Misi3MateriView />}
                  {currentView === 'misi3_work' && <Misi3WorkView />}
                  {currentView === 'misi4_materi' && <Misi4MateriView />}
                  {currentView === 'misi4_work' && <Misi4WorkView />}
                  {currentView === 'preview_publish' && <PreviewPublishView />}
                  {currentView === 'gallery' && <GalleryView />}
                  {currentView === 'teacher_dashboard' && <TeacherDashboardView />}
                  {currentView === 'teacher_detail' && <TeacherDetailView />}
                </main>
                
                <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 font-medium">
                  Rancang Berita © 2026 • Platform Interaktif Pembelajaran Menulis Berita SMA • Guru: Shabrina Luh Nayank Sakti, S.S.
                </footer>
              </>
            )}
          </div>
        );
      }

      // Initialize React Root
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
